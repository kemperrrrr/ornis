# bca baseline file. Generated by `bca check --write-baseline`.
# Listed offenders are filtered from threshold checks; a function that
# gets worse than its recorded value still fails.
# Refresh with `bca check --write-baseline` when entries become stale.
# Docs: https://dekobon.github.io/big-code-analysis/recipes/baselines.html
#
# Initial baseline is intentionally empty.
# Run once locally after tuning bca.toml:
#   cargo install big-code-analysis-cli --locked
#   bca check --write-baseline
#   git add .bca-baseline.toml && git commit -m "chore(bca): initial baseline"
#
# License: this file is content (list of offenders), not code — no MPL impact on Ornis.

version = 6

[provenance]
tier = "soft"
headroom = 0.95
