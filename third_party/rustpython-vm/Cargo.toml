# rustpython-vm 0.5.0 — vendored from RustPython tag 0.5.0
# (commit 39a6486a4cc32231943e14be8a435a68ae35aab0) with a single
# upstream fix applied, see README.md in this directory.
# Standalone form of the upstream workspace manifest: `workspace = true`
# keys are resolved to the values declared in the RustPython workspace
# Cargo.toml at that tag; sibling crates point at their published 0.5.0
# registry versions. Dependency requirements/features/targets mirror the
# manifest of the published crate 1:1 (verified against the crates.io
# dependency listing for rustpython-vm 0.5.0).
[package]
name = "rustpython-vm"
description = "RustPython virtual machine."
version = "0.5.0"
authors = ["RustPython Team"]
edition = "2024"
rust-version = "1.93.0"
repository = "https://github.com/RustPython/RustPython"
license = "MIT"

[features]
default = ["compiler", "wasmbind", "gc", "host_env", "stdio"]
host_env = []
stdio = []
importlib = []
encodings = ["importlib"]
vm-tracing-logging = []
flame-it = ["flame", "flamer"]
freeze-stdlib = ["encodings"]
jit = ["rustpython-jit"]
threading = ["rustpython-common/threading"]
gc = []
compiler = ["parser", "codegen", "rustpython-compiler"]
ast = ["ruff_python_ast", "ruff_text_size"]
codegen = ["rustpython-codegen", "ast"]
parser = ["ast"]
serde = ["dep:serde"]
wasmbind = ["rustpython-common/wasm_js", "chrono/wasmbind", "wasm-bindgen"]

[dependencies]
rustpython-compiler = { version = "0.5.0", optional = true }
rustpython-codegen = { version = "0.5.0", optional = true }
rustpython-common = "0.5.0"
rustpython-derive = "0.5.0"
rustpython-jit = { version = "0.5.0", optional = true }

ruff_python_ast = { package = "rustpython-ruff_python_ast", version = "0.15.8", optional = true }
ruff_python_parser = { package = "rustpython-ruff_python_parser", version = "0.15.8" }
ruff_text_size = { package = "rustpython-ruff_text_size", version = "0.15.8", optional = true }
rustpython-compiler-core = "0.5.0"
rustpython-literal = "0.5.0"
rustpython-sre_engine = "0.5.0"

ascii = "1.1"
ahash = "0.8.12"
bitflags = "2.11.0"
bstr = "1"
cfg-if = "1.0"
crossbeam-utils = "0.8.21"
chrono = { version = "0.4.44", default-features = false, features = ["clock", "oldtime", "std"] }
constant_time_eq = "0.4"
flame = { version = "0.2.2", optional = true }
getrandom = { version = "0.3", features = ["std"] }
hex = "0.4.3"
indexmap = { version = "2.13.0", features = ["std"] }
itertools = "0.14.0"
is-macro = "0.3.7"
libc = "0.2.183"
log = "0.4.29"
malachite-bigint = "0.9.1"
num-complex = "0.4.6"
num-integer = "0.1.46"
num-traits = "0.2"
num_enum = { version = "0.7", default-features = false }
parking_lot = "0.12.3"
paste = "1.0.15"
scoped-tls = "1"
scopeguard = "1"
serde = { package = "serde_core", version = "1.0.225", default-features = false, features = ["alloc"], optional = true }
static_assertions = "1.1"
strum = "0.28"
strum_macros = "0.28"
thiserror = "2.0"
memchr = "2.8.0"

caseless = "0.2.2"
flamer = { version = "0.5", optional = true }
half = "2"
psm = "0.1"
optional = "0.5"
result-like = "0.5.0"
timsort = "0.1.2"

## unicode stuff
# TODO: use unic for this; needed for title case:
# https://github.com/RustPython/RustPython/pull/832#discussion_r275428939
unicode-casing = "0.1.1"
# update version all at the same time
unic-ucd-bidi = "0.9.0"
unic-ucd-category = "0.9.0"
unic-ucd-ident = "0.9.0"

[target.'cfg(unix)'.dependencies]
rustix = { version = "1.1", features = ["event"] }
nix = { version = "0.30", features = ["fs", "user", "process", "term", "time", "signal", "ioctl", "socket", "sched", "zerocopy", "dir", "hostname", "net", "poll"] }
exitcode = "1.1.2"
uname = "0.1.1"

[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
rustyline = "17.0.1"
which = "8"
errno = "0.3"
widestring = "1.2.0"

[target.'cfg(all(any(target_os = "linux", target_os = "macos", target_os = "windows", target_os = "android"), not(any(target_env = "musl", target_env = "sgx"))))'.dependencies]
libffi = { version = "5", features = ["system"] }
libloading = "0.9"

[target.'cfg(any(not(target_arch = "wasm32"), target_os = "wasi"))'.dependencies]
num_cpus = "1.17.0"

[target.'cfg(windows)'.dependencies]
junction = "1.4.2"

[target.'cfg(windows)'.dependencies.windows-sys]
version = "0.61.2"
features = [
  "Win32_Foundation",
  "Win32_Globalization",
  "Win32_Media_Audio",
  "Win32_Networking_WinSock",
  "Win32_Security",
  "Win32_Security_Authorization",
  "Win32_Storage_FileSystem",
  "Win32_System_Console",
  "Win32_System_Diagnostics_Debug",
  "Win32_System_Environment",
  "Win32_System_IO",
  "Win32_System_Ioctl",
  "Win32_System_JobObjects",
  "Win32_System_Kernel",
  "Win32_System_LibraryLoader",
  "Win32_System_Memory",
  "Win32_System_Performance",
  "Win32_System_Pipes",
  "Win32_System_Registry",
  "Win32_System_SystemInformation",
  "Win32_System_SystemServices",
  "Win32_System_Threading",
  "Win32_System_Time",
  "Win32_System_WindowsProgramming",
  "Win32_UI_Shell",
  "Win32_UI_WindowsAndMessaging",
]

[target.'cfg(all(target_arch = "wasm32", target_os = "unknown"))'.dependencies]
wasm-bindgen = { version = "0.2.106", optional = true }

[build-dependencies]
glob = "0.3"
itertools = "0.14.0"
