# rustqual.toml — Ornis quality gate (MIT)
# Run: cargo run --manifest-path /tmp/rustqual -- .  (no global install)
# Docs: https://github.com/SaschaOnTour/rustqual

exclude_files = ["editor/**", "target/**"]

# IOSP leniency: closures/iterator/match-as-dispatch — not logic (PROJECT_REVIEW § BCA→rustqual)
strict_closures = false
strict_iterator_chains = false
strict_error_propagation = false

# ponytail: 60→80 — solver/render do not cut context for a counter; magic without allow-list for now — silence 0/1/2/-1 via // qual:allow
# IOSP leniency by default (closures/iterator/match-as-dispatch — not logic)

max_suppression_ratio = 0.10

[complexity]
enabled = true
max_cognitive = 20
max_cyclomatic = 20
max_nesting_depth = 4
max_function_lines = 80
detect_unsafe = true
detect_error_handling = true
allow_expect = false

[duplicates]
enabled = true

[boilerplate]
enabled = true

[srp]
enabled = true

[coupling]
enabled = true

[structural]
enabled = true

[test_quality]
enabled = true

[tests]
max_function_lines = 120
file_length = 500

[weights]
iosp = 0.22
complexity = 0.18
dry = 0.13
srp = 0.18
coupling = 0.05
test_quality = 0.12
architecture = 0.12
