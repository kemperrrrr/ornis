[workspace]
resolver = "3"
members = [
    "crates/core",
    "crates/macros",
    "crates/ui",
    "crates/wgpu_backend",
    "crates/audio",
    "crates/render",
    "crates/materialx",
    "crates/wasm",
    "xtask",
]
exclude = ["crates/ui-blitz"]

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.90"
license = "MIT OR Apache-2.0"
homepage = "https://github.com/nousresearch/ornis"
repository = "https://github.com/nousresearch/ornis"
categories = ["game-engines", "graphics"]

[package]
name = "ornis"
version.workspace = true
edition.workspace = true
rust-version.workspace = true

[dependencies]
ornis-core = { path = "crates/core" }
ornis-ui = { path = "crates/ui", default-features = false }
ornis-render = { path = "crates/render" }
wgpu = "29"
winit = "0.30"
vello = { version = "0.9", features = ["wgpu"] }
pollster = "0.3"
tiny_http = "0.12"
serde_json = "1"
crossbeam-channel = "0.5"
glam = "0.30"

[patch.crates-io]
boa_engine = { path = "forks/boa_engine" }

[features]
default = ["engine-ours"]
engine-ours = ["ornis-ui/js-engine"]
editor-only = []
