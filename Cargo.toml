[workspace]
resolver = "3"
members = [
    "crates/core",
    "crates/macros",
    "crates/shader-lang",
    "crates/physics",
    "crates/wgpu_backend",
    "crates/audio",
    "crates/render",
    "crates/schedule",
    "crates/materialx",
    "crates/wasm",
    "crates/app",
    "crates/editor-backend",
    "crates/rhai",
    "crates/rune",
    "crates/python",
    "xtask",
]
# Vendored upstream crates (patched via [patch.crates-io] below) are NOT
# workspace members: without this exclude cargo auto-members path deps
# under the workspace root, and clippy --workspace -D warnings / fmt --all
# / test --workspace would run over third-party code.
exclude = ["third_party"]

# rustpython-vm 0.5.0 does not compile against libc >= 0.2.187 (linux-gnu
# POSIX_SPAWN_SETSID became c_short); no patched release exists yet. Vendored
# copy = published 0.5.0 + the one-line upstream fix (RustPython#8343).
# Path source, not git: cargo-deny sources allow-git = [] (supply-chain
# policy) and cargo-outdated/audit ignore path deps. Details:
# third_party/rustpython-vm/README.md.
[patch.crates-io]
rustpython-vm = { path = "third_party/rustpython-vm" }

[workspace.lints.clippy]
# Baseline: all standard lints as warnings.
# pedantic is intentionally off — too noisy for a start.
# unwrap_used/expect_used will be enabled once the baseline is cleared.
all = "warn"

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.97"
license = "MIT OR Apache-2.0"
categories = ["game-engines", "graphics"]

[package]
name = "ornis"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true

[dependencies]
ornis-core = { path = "crates/core" }
ornis-physics = { path = "crates/physics" }
ornis-render = { path = "crates/render" }
ornis-app = { path = "crates/app" }
ornis-audio = { path = "crates/audio" }
ornis-rhai = { path = "crates/rhai" }
editor-backend = { path = "crates/editor-backend" }
wgpu = "30"
winit = "0.30"
pollster = "1.0"
tiny_http = "0.12"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
crossbeam-channel = "0.5"
glam = "0.33"

[features]
default = []
editor-only = []

[lints]
workspace = true
