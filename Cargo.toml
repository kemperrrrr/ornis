[workspace]
resolver = "3"
members = [
    "crates/core",
    "crates/macros",
    "crates/ui",
    "crates/wgpu_backend",
    "crates/audio",
    "crates/render",
    "crates/materialx",
]

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.88"

[package]
name = "ornis"
version.workspace = true
edition.workspace = true
rust-version.workspace = true

[dependencies]
ornis-core = { path = "crates/core" }
ornis-ui = { path = "crates/ui" }
ornis-render = { path = "crates/render" }
wgpu = "26"
winit = "0.30"
vello = { version = "0.6", features = ["wgpu"] }
pollster = "0.3"
tiny_http = "0.12"
serde_json = "1"
crossbeam-channel = "0.5"
glam = "0.30"
