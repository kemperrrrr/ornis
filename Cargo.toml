[workspace]
resolver = "3"
members = [
    "crates/core",
    "crates/input",
    "crates/macros",
    "crates/shader-lang",
    "crates/physics",
    "crates/wgpu_backend",
    "crates/audio",
    "crates/render",
    "crates/schedule",
    "crates/materialx",
    "crates/wasm",
    "crates/animation",
    "crates/app",
    "crates/assets",
    "crates/gameplay",
    "crates/editor-backend",
    "crates/editor",
    "crates/mesh-editor",
    "crates/gltf",
    "crates/shell",
    "crates/runner",
    "xtask",
]
# Vendored rustqual fork: standalone crate with its own lockfile, built via
# `cargo build --manifest-path third_party/rustqual/Cargo.toml` (never a
# workspace member — keeps workspace gates and feature unification clean).
exclude = ["third_party/rustqual"]

[workspace.lints.clippy]
# Baseline: all standard lints as warnings.
# pedantic is intentionally off — too noisy for a start.
# unwrap_used/expect_used will be enabled once the baseline is cleared.
all = "warn"

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.97"
license = "MIT OR Apache-2.0"
categories = ["game-engines", "graphics"]

[package]
name = "ornis"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true

[dependencies]
ornis-assets = { path = "crates/assets", version = "0.1.0" }
ornis-core = { path = "crates/core", version = "0.1.0" }
ornis-gameplay = { path = "crates/gameplay", version = "0.1.0" }
ornis-physics = { path = "crates/physics", version = "0.1.0" }
ornis-render = { path = "crates/render", version = "0.1.0" }
ornis-app = { path = "crates/app", version = "0.1.0" }
ornis-audio = { path = "crates/audio", version = "0.1.0" }
ornis-runner = { path = "crates/runner", version = "0.1.0" }
editor-backend = { path = "crates/editor-backend", version = "0.1.0" }
crossbeam-channel = "0.5"
glam = "0.34"

[features]
default = []
editor-only = []

[lints]
workspace = true

# Large scripting/GPU dependencies otherwise exhaust hosted-runner memory.
# Keep line tables and all debug assertions; only type-level DWARF is reduced.
[profile.dev]
debug = 1

[profile.test]
debug = 1
