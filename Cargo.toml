[workspace]
resolver = "3"
members = [
    "crates/core",
    "crates/macros",
    "crates/wgpu_backend",
    "crates/audio",
    "crates/render",
    "crates/materialx",
    "crates/wasm",
    "xtask",
]

[workspace.lints.clippy]
# Базовый уровень: все стандартные lint'ы как предупреждения.
# pedantic намеренно не включён — слишком шумно для старта.
# unwrap_used/expect_used будут подняты после снятия baseline.
all = "warn"

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.90"
license = "MIT OR Apache-2.0"
homepage = "https://github.com/nousresearch/ornis"
repository = "https://github.com/nousresearch/ornis"
categories = ["game-engines", "graphics"]

[package]
name = "ornis"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true

[dependencies]
ornis-core = { path = "crates/core" }
ornis-render = { path = "crates/render" }
wgpu = "29"
winit = "0.30"
pollster = "0.3"
tiny_http = "0.12"
serde_json = "1"
crossbeam-channel = "0.5"
glam = "0.30"

[features]
default = []
editor-only = []

[lints]
workspace = true
