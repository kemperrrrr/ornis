[workspace]
resolver = "3"
members = [
    "crates/core",
    "crates/macros",
    "crates/physics",
    "crates/wgpu_backend",
    "crates/audio",
    "crates/render",
    "crates/schedule",
    "crates/materialx",
    "crates/wasm",
    "crates/app",
    "crates/editor-backend",
    "crates/rhai",
    "xtask",
]

[workspace.lints.clippy]
# Baseline: all standard lints as warnings.
# pedantic is intentionally off — too noisy for a start.
# unwrap_used/expect_used will be enabled once the baseline is cleared.
all = "warn"

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.97"
license = "MIT OR Apache-2.0"
categories = ["game-engines", "graphics"]

[package]
name = "ornis"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true

[dependencies]
ornis-core = { path = "crates/core" }
ornis-physics = { path = "crates/physics" }
ornis-render = { path = "crates/render" }
editor-backend = { path = "crates/editor-backend" }
wgpu = "30"
winit = "0.30"
pollster = "1.0"
tiny_http = "0.12"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
crossbeam-channel = "0.5"
glam = "0.33"

[features]
default = []
editor-only = []

[lints]
workspace = true
