<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Ornis Remote Editor</title>
<style>
* { margin: 0; padding: 0; box-sizing: border-box; }
body { font: 13px/1.5 -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
       background: #1a1a20; color: #ccc; display: flex; height: 100vh; }
.sidebar { width: 320px; background: #1e1e24; border-right: 1px solid #333; display: flex; flex-direction: column; }
.main { flex: 1; display: flex; flex-direction: column; }
.header { padding: 16px 20px; border-bottom: 1px solid #333; display: flex; align-items: center; gap: 12px; }
.header h1 { font-size: 15px; font-weight: 600; color: #fff; }
.badge { font-size: 11px; background: #3b6ff0; color: #fff; padding: 2px 8px; border-radius: 10px; }
.section { padding: 12px 16px; border-bottom: 1px solid #2a2a30; }
.section-title { font-size: 11px; text-transform: uppercase; color: #666; margin-bottom: 8px; letter-spacing: .5px; }
.stat-row { display: flex; justify-content: space-between; padding: 4px 0; font-size: 13px; }
.stat-row .val { color: #fff; }
.btn { background: #3b6ff0; color: #fff; border: none; padding: 6px 14px; border-radius: 6px; cursor: pointer; font-size: 12px; }
.btn:hover { background: #4f7ff5; }
.btn-secondary { background: #333; color: #ccc; }
.btn-secondary:hover { background: #444; }
.log { flex: 1; overflow-y: auto; padding: 8px 16px; font-family: "SF Mono", Menlo, monospace; font-size: 11px; }
.log-entry { padding: 2px 0; color: #888; }
.log-entry .highlight { color: #6f6; }
.controls { padding: 12px 16px; display: flex; gap: 8px; border-top: 1px solid #333; }
</style>
</head>
<body>
<div class="sidebar">
  <div class="header">
    <h1>Ornis Editor</h1>
    <span class="badge" id="statusBadge">disconnected</span>
  </div>
  <div class="section">
    <div class="section-title">Scene Stats</div>
    <div class="stat-row"><span>Entities</span><span class="val" id="entityCount">0</span></div>
  </div>
  <div class="controls">
    <button class="btn" id="createBtn">+ Create Entity</button>
  </div>
  <div style="flex:1"></div>
  <div class="section" style="border-top:1px solid #333; border-bottom:none">
    <div class="section-title">Help</div>
    <div style="font-size:11px; color:#666">Commands are sent to the game via IPC.</div>
  </div>
</div>
<div class="main">
  <div class="header" style="border-bottom-color:#2a2a30">
    <span style="font-size:13px;color:#888">Event Log</span>
  </div>
  <div class="log" id="log"></div>
</div>
<script>
const API = '';
let eventOffset = 0;

function addLog(msg, highlight) {
  const el = document.getElementById('log');
  const div = document.createElement('div');
  div.className = 'log-entry';
  div.innerHTML = (highlight ? '<span class="highlight">' : '') + msg + (highlight ? '</span>' : '');
  el.appendChild(div);
  el.scrollTop = el.scrollHeight;
}

async function api(path, opts) {
  const r = await fetch(API + path, opts);
  return r.json();
}

async function refreshStatus() {
  try {
    const s = await api('/api/status');
    document.getElementById('entityCount').textContent = s.entity_count ?? '?';
    document.getElementById('statusBadge').textContent = 'connected';
    document.getElementById('statusBadge').style.background = '#3b6ff0';
  } catch {
    document.getElementById('statusBadge').textContent = 'disconnected';
    document.getElementById('statusBadge').style.background = '#666';
  }
}

async function pollEvents() {
  try {
    const events = await api('/api/events');
    if (Array.isArray(events)) {
      for (const ev of events) {
        const line = eventLine(ev);
        if (line) addLog(line, true);
      }
    }
  } catch {}
}

function eventLine(ev) {
  if (ev.EntityCreated) return `EntityCreated id=${ev.EntityCreated.entity_id}`;
  if (ev.EntityDestroyed) return `EntityDestroyed id=${ev.EntityDestroyed.entity_id}`;
  if (ev.ComponentUpdated) return `ComponentUpdated id=${ev.ComponentUpdated.entity_id} ${ev.ComponentUpdated.type_name}`;
  if (ev.CustomEvent) return `Custom: ${ev.CustomEvent.cmd_type}`;
  return null;
}

async function sendCommand(type, data) {
  const body = { type };
  if (data) body.data = data;
  addLog(`→ ${type}`, true);
  await api('/api/command', { method: 'POST', body: JSON.stringify(body), headers: {'Content-Type':'application/json'} });
}

document.getElementById('createBtn').onclick = () => sendCommand('create_entity');

refreshStatus();
setInterval(refreshStatus, 3000);
setInterval(pollEvents, 500);
addLog('Remote editor connected. Press F1/~ in-game for local editor.');
</script>
</body>
</html>
