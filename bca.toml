# bca.toml — big-code-analysis gate for Ornis
# Docs: https://dekobon.github.io/big-code-analysis/
# License of this tool: MPL-2.0, but used as external binary it does NOT affect
# Ornis distribution (MIT OR Apache-2.0). Do NOT add big-code-analysis as library dependency.
#
# Usage:
#   cargo install big-code-analysis-cli --locked   # or prebuilt from releases
#   bca check                                     # uses this file auto-discovered at repo root
#   bca check --write-baseline                      # update .bca-baseline.toml after intentional complexity growth
#   bca report -O html -o target/bca/index.html
#
# The gate is optional: `cargo xtask quality` runs it if `bca` is in PATH,
# otherwise SKIP with install hint (same pattern as audit/deny/outdated).

# `paths` and `exclude_from` are walk-scope: they control which files are
# analysed at all (by `check`, `report` and `metrics` alike). Keep
# `exclude_from` at the top level, NOT under `[check]` — the latter only
# exempts violations from the gate and leaves the walk picking up
# binaries and non-source files.
paths = ["crates", "src", "xtask", "editor"]
exclude_from = ".bcaignore"

[check]
baseline = ".bca-baseline.toml"
# tiered codes (--exit-codes=tiered): 2=new-only, 3=regression-only,
# 4=mixed, 5=soft-tier hard breach — useful for CI branching.
exit_codes = "tiered"

[thresholds]
# Defaults from bca init, tuned for Ornis.
# Rust 97.5th percentile is cognitive=8 / cyclomatic=8, but physics solver
# legitimately exceeds them. We keep defaults permissive and rely on baseline ratchet.
cognitive = 25
cyclomatic = 25
abc = 80
nargs = 8
nexits = 6
"halstead.effort" = 150000
"loc.ploc" = 1000
"loc.sloc" = 2000
nom = 30
wmc = 80

# Per-language overrides: Rust is simpler on average, JS/TS need higher limits
[thresholds.lang.rust]
cognitive = 20
cyclomatic = 20
nexits = 9
# halstead.effort raised to 500000: on dense physics math (solver kernels like
# solve_normal_block, solve_small) the operator/operand count is structurally
# high but the code is correct and test-covered. The Mozilla-default 120000
# was calibrated for C++/JS and false-positives on Rust numeric code. We keep
# halstead as a *soft* signal (baseline-ratcheted) rather than dropping it.
"halstead.effort" = 500000
# File-level LOC limits raised from 900/2000: Rust modules are larger units
# than C++ TUs, and the whole solver lives in one file (engine.rs). The
# Mozilla 900-ploc-per-file default false-positives on monolithic Rust
# modules. Kept high enough to still catch genuinely bloated files.
"loc.ploc" = 5000
"loc.sloc" = 8000
abc = 60

[thresholds.lang.javascript]
cognitive = 30
cyclomatic = 25
"halstead.effort" = 100000

[thresholds.lang.typescript]
cognitive = 30
cyclomatic = 25
"halstead.effort" = 100000
