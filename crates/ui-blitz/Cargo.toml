[package]
name = "ornis-ui-blitz"
version = "0.1.0"
edition = "2024"
rust-version = "1.90"

[dependencies]
ornis-ui = { path = "../ui", default-features = false }
blitz-dom = { path = "../../forks/blitz/packages/blitz-dom" }
blitz-html = { path = "../../forks/blitz/packages/blitz-html" }
blitz-paint = { path = "../../forks/blitz/packages/blitz-paint" }
blitz-net = { path = "../../forks/blitz/packages/blitz-net" }
blitz-traits = { path = "../../forks/blitz/packages/blitz-traits" }
anyrender = "0.11"
anyrender_vello = "0.12"
vello = { version = "0.9", features = ["wgpu"] }
wgpu = "29"
winit = "0.30"
pollster = "0.3"
png = "0.17"
url = "2.5"
tokio = { version = "1", features = ["rt-multi-thread"] }
