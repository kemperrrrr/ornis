[package]
name = "ornis-wasm"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
wgpu = { version = "30", features = ["webgpu"] }
wasm-bindgen = "0.2"
wasm-bindgen-futures = "0.4"
js-sys = "0.3"
web-sys = { version = "0.3", features = [
    "console",
    "Document",
    "Element",
    "EventTarget",
    "Headers",
    "HtmlCanvasElement",
    "HtmlElement",
    "KeyboardEvent",
    "Location",
    "MouseEvent",
    "Navigator",
    "Node",
    "PointerEvent",
    "Request",
    "RequestInit",
    "Response",
    "WheelEvent",
    "Window",
    "WebSocket",
] }
console_error_panic_hook = "0.1"
bytemuck = { version = "1", features = ["derive"] }
glam = "0.34"
ornis-render = { path = "../render", version = "0.1.0" }
ornis-assets = { path = "../assets", version = "0.1.0" }
ornis-core = { path = "../core", version = "0.1.0" }
ornis-app = { path = "../app", version = "0.1.0" }
ron = "0.12"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
raw-window-handle = "0.6"

[features]
default = []

[lints]
workspace = true
