[package]
name = "ornis-python"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true

[dependencies]
ornis-core = { path = "../core" }
# rustpython-vm is deliberately !Send/!Sync (interpreter state is bound
# to the thread that enters it), so the engine below runs it on a
# dedicated worker thread and only JSON bytes cross the boundary.
rustpython-vm = "0.5"
serde_json = "1"

[lints]
workspace = true
