[package]
name = "ornis-gltf"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true

[dependencies]
gltf = { version = "1", default-features = false, features = ["utils", "names"] }
# Minimal decoders for the core glTF image mimes (PNG/JPEG): sniffing plus
# RGBA8 conversion. No default features — the full `image` tree (tiff, webp,
# exr, …) stays out of a geometry-first loader.
image = { version = "0.25", default-features = false, features = ["png", "jpeg"] }
thiserror = "2.0"
# Animation-clip assembly (docs/animation-design.md §4): object tracks key
# their entities with `ornis-core` handles; skeletal/value types stay plain
# arrays (same seam as `LoadedSkin`, never a stub dependency).
ornis-core = { path = "../core" }

[lints]
workspace = true
