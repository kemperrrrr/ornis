[package]
name = "ornis-texture"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true

[dependencies]
ktx2 = "0.5"
# Pure Rust (including Zstd): the same transcoder builds on native and wasm.
# Disable its ruzstd 0.7 dependency (RUSTSEC-2026-0344); inflate with the
# patched decoder below before passing plain UASTC levels to Basis.
basisu = { version = "0.1", default-features = false, features = ["std"] }
ruzstd = { version = "0.9.1", default-features = false, features = ["std"] }
texture2ddecoder = "0.1.2"
thiserror = "2.0"

[lints]
workspace = true
