[package]
name = "ornis-wasm2gpu-shader"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
description = "Rust shader body lowered by ornis-wasm2gpu (not the production shader DSL)"

[lib]
crate-type = ["rlib", "cdylib"]

[dependencies]
ornis-gpu-abi = { path = "../gpu-abi", version = "0.1.0" }

[dev-dependencies]
ornis-wasm2gpu = { path = "../wasm2gpu", version = "0.1.0" }
ornis-wasm2gpu-testkit = { path = "../wasm2gpu-testkit", version = "0.1.0" }
wasmparser = "0.262"
wat = "1"
wgpu = { version = "30" }

[lints]
workspace = true
