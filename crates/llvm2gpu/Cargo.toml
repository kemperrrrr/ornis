[package]
name = "ornis-llvm2gpu"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
description = "Offline translator from LLVM IR (stable rustc) to WGSL and SPIR-V for scalar compute kernels"

[dependencies]
ornis-gpu-abi = { path = "../gpu-abi", version = "0.1.0" }
naga = { version = "30", features = ["wgsl-in", "wgsl-out", "spv-in", "spv-out"] }

[dev-dependencies]
wgpu = "30"
pollster = "0.4"

[lints]
workspace = true
