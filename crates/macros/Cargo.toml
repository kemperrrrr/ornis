[package]
name = "ornis-macros"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true

[lib]
proc-macro = true

[dependencies]
ornis-shader-lang = { path = "../shader-lang" }
syn = { version = "3", features = ["full", "visit", "visit-mut"] }
quote = "1"
proc-macro2 = "1"
glam = { version = "0.33", optional = true }

[dev-dependencies]
naga = { version = "30", features = ["wgsl-out"] }
ornis-core = { path = "../core" }
glam = "0.33"
trybuild = "1"

[lints]
workspace = true
