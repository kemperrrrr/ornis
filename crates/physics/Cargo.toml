[package]
name = "ornis-physics"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true

[dependencies]
glam = "0.30"
rayon = "1.10"
wgpu = { version = "29", optional = true }
bytemuck = { version = "1", features = ["derive"], optional = true }

[features]
default = []
gpu = ["dep:wgpu", "dep:bytemuck"]

[dev-dependencies]
criterion = { version = "0.5", features = ["rayon"] }

[[bench]]
name = "solver_bench"
harness = false

[lints]
workspace = true