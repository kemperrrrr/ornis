[package]
name = "ornis-physics"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true

[dependencies]
glam = "0.33"
ornis-assets = { path = "../assets" }
ornis-core = { path = "../core" }
rayon = "1.12"
dashmap = "6"
ornis-macros = { path = "../macros" }
ornis-schedule = { path = "../schedule" }
thiserror = "2.0"
serde = { version = "1", features = ["derive"] }
ron = "0.12"
wgpu = { version = "30" }
naga = { version = "30", optional = true }
bytemuck = { version = "1", features = ["derive"], optional = true }
rustc-hash = "2.1.3"

[features]
default = []
gpu = ["dep:bytemuck", "dep:naga"]
# Shootout backend feature names kept for check-cfg + a later restore.
# Optional `rapier3d` / `boxddd` deps are temporarily omitted: their lockfile
# pull of nalgebra convert-glam030/031/032 makes `cargo outdated --workspace`
# fail the hard gate (Project 0.30/0.31/0.32 while Latest is 0.33). Enabling
# these features without re-adding the deps will not compile the backends.
rapier = []
box3d = []

[dev-dependencies]
criterion = { version = "0.8", features = ["rayon"] }
naga = "30"
pollster = "1.0"

[[bench]]
name = "solver_bench"
harness = false

[[bench]]
name = "engine_shootout"
harness = false

[[bench]]
name = "query_bench"
harness = false

[lints]
workspace = true
