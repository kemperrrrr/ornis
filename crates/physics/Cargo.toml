[package]
name = "ornis-physics"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true

[dependencies]
glam = "0.33"
ornis-assets = { path = "../assets" }
rayon = "1.12"
dashmap = "6"
ornis-macros = { path = "../macros" }
ornis-schedule = { path = "../schedule" }
wgpu = { version = "30" }
naga = { version = "30", optional = true }
bytemuck = { version = "1", features = ["derive"], optional = true }
rustc-hash = "2.1.3"

[features]
default = []
gpu = ["dep:bytemuck", "dep:naga"]

[dev-dependencies]
criterion = { version = "0.8", features = ["rayon"] }
naga = "30"
pollster = "1.0"

[[bench]]
name = "solver_bench"
harness = false

[lints]
workspace = true
