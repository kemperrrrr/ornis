[package]
name = "ornis-wasm2gpu"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
description = "Offline toy translator from the ornis_gpu wasm ABI to WGSL and SPIR-V"

[dependencies]
ornis-gpu-abi = { path = "../gpu-abi", version = "0.1.0" }
naga = { version = "30", features = ["wgsl-in", "wgsl-out", "spv-in", "spv-out"] }
wasmparser = "0.262"

[dev-dependencies]
wat = "1"

[lints]
workspace = true
