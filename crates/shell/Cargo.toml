[package]
name = "ornis-shell"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
description = "Desktop shell for the Ornis editor: native window (wry webview) over the editor frontend, no localhost"

[dependencies]
editor-backend = { path = "../editor-backend", version = "0.1.0" }
ornis-app = { path = "../app", version = "0.1.0" }
# Native viewport: the replica world's camera/pointer resources, the editor
# marks the outline is drawn from, and the frame path itself.
ornis-core = { path = "../core", version = "0.1.0" }
ornis-editor = { path = "../editor", version = "0.1.0" }
ornis-render = { path = "../render", version = "0.1.0" }
crossbeam-channel = "0.5"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2.0"
# Minimal surface: OS webview + custom protocol + IPC only.
# `os-webview` is mandatory (without it the crate does nothing);
# devtools stay on the debug-build default (macOS), no release flag.
wry = { version = "0.58.1", default-features = false, features = ["os-webview"] }
winit = "0.30"

# Native viewport (PLAN.md §j, вариант 1): wgpu renders the scene straight
# into a `CAMetalLayer` under the transparent webview region, so the editor
# keeps its webview UI without needing WebGPU inside WKWebView.
wgpu = "30"
pollster = "1.0"
raw-window-handle = "0.6"

# AppKit plumbing for that layer (macOS only — the surface target does not
# exist elsewhere). `objc2*` versions stay pinned to the set `wry`/`winit`
# already resolve, so Cargo has one copy of each.
[target.'cfg(target_os = "macos")'.dependencies]
objc2 = "0.6"
objc2-app-kit = { version = "0.3.2", default-features = false, features = [
    "std",
    "NSResponder",
    "NSView",
    "NSWindow",
    "NSGraphics",
] }
objc2-foundation = { version = "0.3.2", default-features = false, features = [
    "std",
    "NSGeometry",
] }
objc2-quartz-core = { version = "0.3.2", default-features = false, features = [
    "std",
    "CALayer",
    "CAMetalLayer",
] }
# The webview's own class, to reach the `NSView` it is installed into.
objc2-web-kit = { version = "0.3.2", default-features = false, features = [
    "std",
    "objc2-app-kit",
    "WKWebView",
] }

[lints]
workspace = true
