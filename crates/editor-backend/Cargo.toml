[package]
name = "editor-backend"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true

[dependencies]
tiny_http = "0.12"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
crossbeam-channel = "0.5"
glam = "0.34"
ornis-input = { path = "../input", version = "0.1.0" }
# Typed command errors (`thiserror::Error` on `SetComponentError`).
thiserror = "2.0"

# WebSocket framing for `/api/events` (server role, handshake only, no
# TLS). Native-only: the loopback socket server cannot run in the browser,
# so wasm32 targets skip the whole transport (protocol types, guards and
# `ScenePath` stay available — only the socket code is gated out).
[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
tungstenite = { version = "0.30", default-features = false, features = ["handshake"] }

[dev-dependencies]

[lints]
workspace = true
