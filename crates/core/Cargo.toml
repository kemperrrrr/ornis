[package]
name = "ornis-core"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true

[dependencies]
rayon = "1.10"
fixedbitset = "0.5"
crossbeam-channel = "0.5"
crossbeam-epoch = "0.9"
glam = "0.30"
bytemuck = { version = "1", features = ["derive"] }

[features]
default = []
# Зарезервированные точки расширения (используются через cfg в коде):
gpu = []        # GpuExecutor в dispatcher (пока CPU-fallback)
lock-free = []  # экспериментальные lock-free ленты

[dev-dependencies]
criterion = { version = "0.5", features = ["rayon"] }
bytemuck = { version = "1.25", features = ["derive"] }
ornis-macros = { path = "../macros" }
proptest = "1"

[[bench]]
name = "store_bench"
harness = false

[[bench]]
name = "comparison_bench"
harness = false

[lints]
workspace = true
