[package]
name = "ornis-core"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true

[dependencies]
rayon = "1.10"
fixedbitset = "0.5"
crossbeam-channel = "0.5"
crossbeam-epoch = "0.9"
glam = "0.30"
bytemuck = { version = "1", features = ["derive"] }
# Provides the #[mutants::skip] attribute used in prefetch.rs; a no-op at
# runtime (see https://mutants.rs/attrs.html). Must be a regular
# dependency, not dev, because the annotation sits on non-test code.
mutants = "0.0.3"
# F0 (audit 2026-08-22, §10): JSON-операции реестра компонентов —
# без derive в основном коде (derive подключается тестами ниже).
serde = "1.0"
serde_json = "1"
# Фаза A (аудит §7): механика уровней/рёбер/кеша планировщика.
ornis-schedule = { path = "../schedule" }

[features]
default = []
# Reserved extension points (used via cfg in code):
gpu = []        # GpuExecutor in the dispatcher (CPU-fallback for now)
lock-free = []  # experimental lock-free lanes

[dev-dependencies]
serde = { version = "1.0", features = ["derive"] }
criterion = { version = "0.5", features = ["rayon"] }
bytemuck = { version = "1.25", features = ["derive"] }
ornis-macros = { path = "../macros" }
proptest = "1"
ornis-physics = { path = "../physics" }

[[bench]]
name = "store_bench"
harness = false

[[bench]]
name = "comparison_bench"
harness = false

[lints]
workspace = true
