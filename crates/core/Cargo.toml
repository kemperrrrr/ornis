[package]
name = "ornis-core"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true

[dependencies]
rayon = "1.12"
fixedbitset = "0.5"
crossbeam-channel = "0.5"
crossbeam-epoch = "0.9"
glam = "0.33"
bytemuck = { version = "1", features = ["derive"] }
# Provides the #[mutants::skip] attribute used in prefetch.rs; a no-op at
# runtime (see https://mutants.rs/attrs.html). Must be a regular
# dependency, not dev, because the annotation sits on non-test code.
mutants = "0.0.4"
# F0 (audit 2026-08-22, §10): component registry JSON operations —
# without derive in main code (derive is pulled in by tests below).
serde = "1.0"
serde_json = "1"
# Typed errors (`thiserror::Error` derives on registry/mutation/schedule errors).
thiserror = "2.0"
# Phase A (audit §7): scheduler level/edge/cache mechanics.
ornis-schedule = { path = "../schedule" }
# Backend-neutral input state, named keys and action mapping.
ornis-input = { path = "../input" }

[features]
default = []
# Reserved extension point (used via cfg in code):
lock-free = []  # experimental lock-free lanes

[dev-dependencies]
serde = { version = "1.0", features = ["derive"] }
ron = "0.12"
criterion = { version = "0.8", features = ["rayon"] }
bytemuck = { version = "1.25", features = ["derive"] }
ornis-macros = { path = "../macros" }
proptest = "1"

[[bench]]
name = "store_bench"
harness = false

[[bench]]
name = "comparison_bench"
harness = false

[lints]
workspace = true
