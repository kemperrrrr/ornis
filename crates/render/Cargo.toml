[package]
name = "ornis-render"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true

[dependencies]
ornis-texture = { path = "../texture", version = "0.1.0" }
wgpu = "30"
naga = { version = "30", features = ["wgsl-out"] }
bytemuck = { version = "1", features = ["derive"] }
glam = "0.34"
ornis-assets = { path = "../assets", version = "0.1.0" }
ornis-core = { path = "../core", version = "0.1.0" }
# Phase C (animation-design §2.3): extraction reads the `SkinnedMesh` lane to
# publish pre-skinned world vertices (`CustomMeshEntry.skinned`). One-way
# edge — `ornis-animation` never depends on `ornis-render`.
ornis-animation = { path = "../animation", version = "0.1.0" }
ornis-mesh-editor = { path = "../mesh-editor", version = "0.1.0" }
ornis-macros = { path = "../macros", version = "0.1.0" }
# Phase A (audit §7): shared engine for levels/edges/OrderError.
ornis-schedule = { path = "../schedule", version = "0.1.0" }
serde = { version = "1", features = ["derive"] }
ron = "0.12"
# Typed projection/upload errors (`thiserror::Error` derives).
thiserror = "2.0"
# Block on the shared headless device bootstrap (`try_headless_device`).
# Optional: the bootstrap is test-only, so the wasm/production graph does
# not pull the poller in — the `test-util` feature turns it on (the GPU
# gates and the criterion bench build with it).
pollster = { version = "1.0", optional = true }
# The wasm2gpu cull A/B bench lowers the guest kernel. Optional for the
# same reason as `pollster`: the frame path does not translate shaders.
ornis-wasm2gpu-testkit = { path = "../wasm2gpu-testkit", version = "0.1.0", optional = true }

[features]
# Headless GPU-gate helpers (`try_headless_device`, `read_bytes_back`,
# `gpu_required`). Test-only: the in-crate gates compile them under
# `cfg(test)`, and the criterion bench builds with this feature.
test-util = ["dep:pollster", "dep:ornis-wasm2gpu-testkit"]

[dev-dependencies]
png = "0.18"
proptest = "1"
wgpu = "30"
glam = "0.34"
ornis-shader-lang = { path = "../shader-lang", version = "0.1.0" }
ornis-wasm2gpu-testkit = { path = "../wasm2gpu-testkit", version = "0.1.0" }
criterion = { version = "0.8", features = ["rayon"] }
# The in-crate GPU gates block on the headless bootstrap; the poller is
# optional in the normal graph (see the `test-util` feature) and plain
# in the dev graph.
pollster = "1.0"

[[bench]]
name = "layout_bench"
harness = false

[[bench]]
name = "recording_bench"
harness = false

[[bench]]
name = "culling_bench"
harness = false
required-features = ["test-util"]

[[bench]]
name = "wasm2gpu_cull_ab"
harness = false
required-features = ["test-util"]

[lints]
workspace = true
