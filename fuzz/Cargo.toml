[package]
name = "ornis-fuzz"
version = "0.0.0"
publish = false
edition = "2021"

[package.metadata]
cargo-fuzz = true

# A crate independent from the root workspace (cargo-fuzz convention):
# do NOT add to members of the root Cargo.toml. Run only via
# `cargo +nightly fuzz run <target>` — rust-toolchain.toml pins stable,
# so +nightly is passed explicitly (cargo xtask fuzz does this too).

[dependencies]
libfuzzer-sys = "0.4"
editor-backend = { path = "../crates/editor-backend" }
# scene_ron target parses `ornis_assets::scene::Scene::from_ron` (RON only,
# so default features stay off — keeps the nightly fuzz build light).
ornis-assets = { path = "../crates/assets", default-features = false }
ornis-materialx = { path = "../crates/materialx" }

# Prevents "multiple workspace roots" from the root workspace.
[workspace]

[[bin]]
name = "scene_ron"
path = "fuzz_targets/scene_ron.rs"
test = false
doc = false

[[bin]]
name = "materialx_parse"
path = "fuzz_targets/materialx_parse.rs"
test = false
doc = false

[[bin]]
name = "editor_command"
path = "fuzz_targets/editor_command.rs"
test = false
doc = false
