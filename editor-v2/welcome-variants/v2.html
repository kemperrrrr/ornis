<!DOCTYPE html>
<!-- Ornis start-screen concept: Centred column. Standalone mockup (static data). -->
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Ornis — Welcome (Centred column)</title>
<link rel="stylesheet" href="../styles.css" />
<style>
:root { --accent: #7c8aff; --accent-soft: rgba(124, 138, 255, 0.16); --accent-line: rgba(124, 138, 255, 0.55); }
html, body { height: 100%; }
body { display: block; overflow: hidden; background: var(--panel); color: var(--text); -webkit-font-smoothing: antialiased; }
.ico { width: 16px; height: 16px; flex: none; fill: none; stroke: currentColor; stroke-width: 1.6; stroke-linecap: round; stroke-linejoin: round; }
.wordmark { font-family: -apple-system, BlinkMacSystemFont, "SF Pro Display", "Inter", system-ui, sans-serif; font-weight: 700; letter-spacing: -0.02em; }
kbd { font: 500 11px/1 -apple-system, BlinkMacSystemFont, "Inter", system-ui, sans-serif; color: var(--muted); padding: 3px 6px; border-radius: 5px; border: 1px solid rgba(255,255,255,0.1); background: rgba(255,255,255,0.04); }
.thumb svg { display: block; width: 100%; height: 100%; }
button { cursor: pointer; }

body { background: radial-gradient(900px 480px at 50% -8%, rgba(124,138,255,0.16), transparent 70%), color-mix(in srgb, var(--panel) 60%, var(--field)); }
body::before { content: ""; position: fixed; inset: 0; background-image: radial-gradient(rgba(255,255,255,0.05) 1px, transparent 1px); background-size: 24px 24px; mask-image: radial-gradient(ellipse at 50% 30%, #000 20%, transparent 70%); -webkit-mask-image: radial-gradient(ellipse at 50% 30%, #000 20%, transparent 70%); pointer-events: none; }
.col { position: relative; width: 760px; margin: 0 auto; height: 100vh; display: flex; flex-direction: column; justify-content: center; padding-bottom: 40px; }
.hero { text-align: center; }
.hero .wordmark { font-size: 72px; line-height: 1; letter-spacing: -0.045em; background: linear-gradient(180deg, #fff 30%, #b9bccc); -webkit-background-clip: text; background-clip: text; color: transparent; }
.hero p { margin: 14px 0 0; color: var(--muted); font-size: 15px; }
.cmd { margin-top: 40px; display: flex; align-items: center; gap: 12px; height: 56px; padding: 0 14px 0 18px; border-radius: 14px; background: rgba(24,24,26,0.85); border: 1px solid rgba(255,255,255,0.09); box-shadow: 0 1px 0 rgba(255,255,255,0.04) inset, 0 20px 50px rgba(0,0,0,0.35); color: var(--muted); transition: border-color .15s, box-shadow .15s; }
.cmd:hover { border-color: rgba(255,255,255,0.14); }
.cmd:focus-within { border-color: var(--accent-line); box-shadow: 0 0 0 4px var(--accent-soft), 0 20px 50px rgba(0,0,0,0.35); }
.cmd .ico { width: 20px; height: 20px; }
.cmd input { flex: 1; min-width: 0; background: none; border: 0; outline: 0; color: var(--text); font: inherit; font-size: 16px; }
.cmd input::placeholder { color: #77777c; }
.cmd kbd { font-size: 12px; padding: 4px 7px; }
.sec { margin-top: 36px; display: flex; align-items: baseline; justify-content: space-between; padding: 0 2px; }
.sec h2 { margin: 0; font-size: 12px; font-weight: 600; text-transform: uppercase; letter-spacing: .08em; color: var(--muted); }
.sec a { font-size: 12px; color: var(--muted); text-decoration: none; display: inline-flex; align-items: center; gap: 4px; }
.sec a .ico { width: 13px; height: 13px; }
.sec a:hover { color: #fff; }
.recents { margin-top: 12px; display: grid; grid-template-columns: repeat(4, 1fr); gap: 14px; }
.rc { border-radius: 12px; background: rgba(35,35,38,0.8); border: 1px solid rgba(255,255,255,0.06); overflow: hidden; transition: transform .15s ease, border-color .15s, background .15s; cursor: default; }
.rc:hover { transform: translateY(-2px); border-color: rgba(255,255,255,0.14); background: rgba(45,45,50,0.9); }
.rc .thumb { height: 104px; position: relative; }
.rc .thumb::after { content: ""; position: absolute; inset: 0; box-shadow: inset 0 -1px 0 rgba(255,255,255,0.05); }
.rc .t { padding: 10px 12px 12px; }
.rc .n { font-size: 13px; font-weight: 600; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.rc .d { font-size: 11.5px; color: var(--muted); margin-top: 2px; display: flex; justify-content: space-between; }
.rc.current { border-color: var(--accent-line); }
.rc.current .dot { width: 6px; height: 6px; border-radius: 50%; background: var(--accent); align-self: center; box-shadow: 0 0 8px var(--accent); }
.links { margin-top: 36px; display: flex; justify-content: center; gap: 6px; }
.links button { display: inline-flex; align-items: center; gap: 8px; height: 34px; padding: 0 12px; border-radius: 8px; border: 0; background: none; color: #cfcfd3; font-size: 13px; transition: background .12s, color .12s; }
.links button:hover { background: rgba(255,255,255,0.06); color: #fff; }
.links button:hover .ico { color: var(--accent); }
.links .ico { color: var(--muted); transition: color .12s; }
.links kbd { margin-left: 2px; }
.links .sep { width: 1px; height: 16px; background: rgba(255,255,255,0.1); align-self: center; margin: 0 6px; }
.foot { position: fixed; left: 0; right: 0; bottom: 22px; display: flex; justify-content: center; gap: 18px; font-size: 12px; color: #6f6f75; }
.foot a { color: inherit; text-decoration: none; }
.foot a:hover { color: #fff; }
</style>
</head>
<body>

<div class="col">
  <div class="hero">
    <div class="wordmark">Ornis</div>
    <p>Pick up where you left off, or start something new.</p>
  </div>
  <label class="cmd"><svg class="ico" viewBox="0 0 24 24"><circle cx="11" cy="11" r="6.5"/><path d="M20 20l-4.4-4.4"/></svg><input placeholder="Search projects or type a command…" /><kbd>⌘K</kbd></label>
  <div class="sec"><h2>Recent</h2><a href="#">View all<svg class="ico" viewBox="0 0 24 24"><path d="M5 12h14M13 6l6 6-6 6"/></svg></a></div>
  <section class="recents">
      <article class="rc current" tabindex="0" title="~/AI-Projects/ornis/demo">
        <div class="thumb" data-thumb="demo"></div>
        <div class="t"><div class="n">demo</div><div class="d"><span>12 minutes ago</span><span class="dot"></span></div></div>
      </article>
      <article class="rc" tabindex="0" title="~/AI-Projects/terrain_test">
        <div class="thumb" data-thumb="terrain"></div>
        <div class="t"><div class="n">terrain_test</div><div class="d"><span>Yesterday</span></div></div>
      </article>
      <article class="rc" tabindex="0" title="~/AI-Projects/ornis/examples/physics_sandbox">
        <div class="thumb" data-thumb="physics"></div>
        <div class="t"><div class="n">physics_sandbox</div><div class="d"><span>3 days ago</span></div></div>
      </article>
      <article class="rc" tabindex="0" title="~/Projects/ornis_showcase">
        <div class="thumb" data-thumb="showcase"></div>
        <div class="t"><div class="n">ornis_showcase</div><div class="d"><span>Sep 18</span></div></div>
      </article>
  </section>
  <div class="links">
    <button data-action="new"><svg class="ico" viewBox="0 0 24 24"><path d="M12 5v14M5 12h14"/></svg>New Project<kbd>⌘N</kbd></button><span class="sep"></span>
    <button data-action="open"><svg class="ico" viewBox="0 0 24 24"><path d="M3.5 7.5a2 2 0 0 1 2-2h3.7l2 2h7.3a2 2 0 0 1 2 2v7.5a2 2 0 0 1-2 2h-13a2 2 0 0 1-2-2z"/></svg>Open Project<kbd>⌘O</kbd></button><span class="sep"></span>
    <button data-action="clone"><svg class="ico" viewBox="0 0 24 24"><circle cx="6.5" cy="5.5" r="2"/><circle cx="6.5" cy="18.5" r="2"/><circle cx="17.5" cy="8.5" r="2"/><path d="M6.5 7.5v9M17.5 10.5c0 4-5 3.5-9.6 6.6"/></svg>Clone Repository<kbd>⇧⌘C</kbd></button>
  </div>
</div>
<div class="foot"><span>Ornis 0.1</span><a href="#">Docs</a><a href="#">Changelog</a><a href="#">Settings</a></div>
<script>

var PROJECTS = [
  { id: "demo", name: "demo", path: "~/AI-Projects/ornis/demo", date: "12 minutes ago", short: "12m ago", scenes: 1, pinned: true },
  { id: "terrain", name: "terrain_test", path: "~/AI-Projects/terrain_test", date: "Yesterday", short: "Yesterday", scenes: 3 },
  { id: "physics", name: "physics_sandbox", path: "~/AI-Projects/ornis/examples/physics_sandbox", date: "3 days ago", short: "3d ago", scenes: 5 },
  { id: "showcase", name: "ornis_showcase", path: "~/Projects/ornis_showcase", date: "Sep 18", short: "2w ago", scenes: 8 }
];
function _sphere(p, i, cx, cy, r, col) {
  var id = p + "s" + i;
  return '<defs><radialGradient id="' + id + '" cx="36%" cy="30%" r="78%">' +
    '<stop offset="0" stop-color="#fff" stop-opacity=".95"/><stop offset=".16" stop-color="' + col + '"/>' +
    '<stop offset=".7" stop-color="' + col + '"/><stop offset="1" stop-color="#0b0b12"/></radialGradient></defs>' +
    '<ellipse cx="' + cx + '" cy="' + (cy + r * 0.96) + '" rx="' + r * 0.95 + '" ry="' + r * 0.2 + '" fill="#000" opacity=".38"/>' +
    '<circle cx="' + cx + '" cy="' + cy + '" r="' + r + '" fill="url(#' + id + ')"/>';
}
function _cube(x, y, s, col) {           // isometric cube, (x, y) = bottom-front corner
  var h = s * 0.5, w = s * 0.866;
  var top = [[x, y - 2 * s + 0], [x + w, y - s - h], [x, y - s - 2 * h + 0], [x - w, y - s - h]];
  top = [[x, y - s], [x + w, y - s - h], [x, y - s - 2 * h], [x - w, y - s - h]];
  var L = [[x - w, y - s - h], [x, y - s], [x, y], [x - w, y - h]];
  var R = [[x, y - s], [x + w, y - s - h], [x + w, y - h], [x, y]];
  function pts(a) { return a.map(function (q) { return q[0].toFixed(1) + "," + q[1].toFixed(1); }).join(" "); }
  return '<ellipse cx="' + x + '" cy="' + (y - h * 0.4) + '" rx="' + w * 1.15 + '" ry="' + h * 0.75 + '" fill="#000" opacity=".3"/>' +
    '<polygon points="' + pts(L) + '" fill="' + col + '"/><polygon points="' + pts(L) + '" fill="#000" opacity=".28"/>' +
    '<polygon points="' + pts(R) + '" fill="' + col + '"/><polygon points="' + pts(R) + '" fill="#000" opacity=".5"/>' +
    '<polygon points="' + pts(top) + '" fill="' + col + '"/><polygon points="' + pts(top) + '" fill="#fff" opacity=".12"/>';
}
function _floor(p, hy, col, line) {
  var s = '<rect x="0" y="' + hy + '" width="320" height="' + (200 - hy) + '" fill="' + col + '"/><g stroke="' + line + '" stroke-width="1">';
  for (var i = -10; i <= 10; i++) s += '<line x1="' + (160 + i * 12) + '" y1="' + hy + '" x2="' + (160 + i * 64) + '" y2="200"/>';
  for (var k = 1; k <= 6; k++) { var y = hy + (200 - hy) * Math.pow(k / 6, 1.8); s += '<line x1="0" y1="' + y.toFixed(1) + '" x2="320" y2="' + y.toFixed(1) + '"/>'; }
  return s + '</g>';
}
function sceneSVG(id, prefix) {
  var p = (prefix || "t") + id, sky, body = "";
  if (id === "demo") {
    sky = ["#2f3240", "#1b1c22"];
    body = _floor(p, 128, "#24252c", "rgba(255,255,255,.06)");
    [["#d23b3b", 70], ["#3cae4a", 115], ["#3f6fe0", 160], ["#e0b021", 205], ["#d9d9de", 250]].forEach(function (c, i) {
      body += _sphere(p, i, c[1], 118, 18, c[0]); });
  } else if (id === "terrain") {
    sky = ["#e08a5c", "#5b3a6e"];
    body = '<circle cx="232" cy="92" r="20" fill="#ffd9a0" opacity=".9"/>' +
      '<polygon points="0,130 40,96 78,118 120,78 168,120 210,92 262,126 320,100 320,200 0,200" fill="#3d2a52"/>' +
      '<polygon points="0,150 50,124 96,142 150,112 204,146 252,128 320,146 320,200 0,200" fill="#2a1f3b"/>' +
      '<polygon points="0,172 70,154 140,170 214,150 320,168 320,200 0,200" fill="#1c1628"/>';
  } else if (id === "physics") {
    sky = ["#20403f", "#141d20"];
    body = _floor(p, 132, "#18272a", "rgba(120,255,230,.07)") +
      _cube(118, 182, 26, "#2fb3a0") + _cube(164, 182, 26, "#2fb3a0") + _cube(141, 141, 26, "#45d1bd") +
      _cube(214, 176, 18, "#e0a03a") + _sphere(p, 0, 236, 58, 13, "#ff6b5a") +
      '<path d="M236 76v10M231 82l5 6 5-6" stroke="#ff6b5a" stroke-width="1.6" fill="none" opacity=".5" stroke-linecap="round"/>';
  } else {
    sky = ["#3a2f6b", "#15131f"];
    body = '<ellipse cx="160" cy="112" rx="120" ry="70" fill="#7c8aff" opacity=".18"/>' +
      _floor(p, 136, "#1c1a2a", "rgba(124,138,255,.12)") +
      _sphere(p, 0, 128, 112, 32, "#8d97ff") + _cube(206, 160, 30, "#c25bd6");
  }
  return '<svg viewBox="0 0 320 200" preserveAspectRatio="xMidYMid slice" xmlns="http://www.w3.org/2000/svg">' +
    '<defs><linearGradient id="' + p + 'sky" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="' + sky[0] + '"/><stop offset="1" stop-color="' + sky[1] + '"/></linearGradient></defs>' +
    '<rect width="320" height="200" fill="url(#' + p + 'sky)"/>' + body + '</svg>';
}
function fillThumbs(root) {
  (root || document).querySelectorAll("[data-thumb]").forEach(function (el, i) {
    el.insertAdjacentHTML("afterbegin", sceneSVG(el.getAttribute("data-thumb"), "t" + i + "_"));
  });
}

fillThumbs();
document.querySelectorAll("[data-action]").forEach(function (b) { b.onclick = function () { console.log("[welcome v2] " + b.dataset.action); }; });
document.addEventListener("keydown", function (e) { if ((e.metaKey || e.ctrlKey) && e.key.toLowerCase() === "k") { e.preventDefault(); document.querySelector(".cmd input").focus(); } });
</script>
</body>
</html>
