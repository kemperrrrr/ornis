<!DOCTYPE html>
<!-- Ornis level-editor redesign mockup (static, no backend).
  Original layout: general editor zones (hierarchy / viewport / inspector /
  asset browser) are functional patterns. No third-party UI is copied:
  all styles, labels and sample content are Ornis-specific. -->
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Ornis — Level Editor Mockup</title>
<link rel="stylesheet" href="./styles.css" />
</head>
<body>
<main class="layout">
  <!-- LEFT: full-height hierarchy -->
  <aside class="panel left">
    <div class="panel-bar">
      <button class="ghost" id="toggle-left" title="Collapse panel">
        <svg viewBox="0 0 24 24"><use href="../editor/icons/dock-left.svg#icon" /></svg>
      </button>
    </div>
    <div class="tree-tools">
      <label class="search">
        <svg viewBox="0 0 24 24"><use href="../editor/icons/search.svg#icon" /></svg>
        <input id="tree-filter" type="text" placeholder="Filter" />
      </label>
      <button class="ghost" id="add-entity" title="Add entity">
        <svg viewBox="0 0 24 24"><use href="../editor/icons/plus.svg#icon" /></svg>
      </button>
    </div>
    <div class="tree" id="tree" tabindex="0" aria-label="Scene hierarchy"></div>
  </aside>

  <div class="center-top">
    <div class="top-row">
    <div class="project"><strong>demo</strong></div>
    <div class="palette-wrap">
      <div class="transport" role="toolbar" aria-label="Play controls">
        <button id="btn-play" title="Play">
          <svg viewBox="0 0 24 24"><use id="play-icon" href="../editor/icons/play.svg#icon" /></svg>
        </button>
        <button id="btn-pause" title="Pause" disabled>
          <svg viewBox="0 0 24 24"><use href="../editor/icons/pause.svg#icon" /></svg>
        </button>
      </div>
      <label class="search palette" title="Command Palette (Ctrl/⌘+K)">
        <svg viewBox="0 0 24 24"><use href="../editor/icons/search.svg#icon" /></svg>
        <input id="command-palette" type="text" placeholder="Command Palette" aria-label="Command Palette" />
        <kbd>⌘K</kbd>
      </label>
    </div>
    </div>
    <!-- Second row: open scene/entity tabs (Godot-style); filled by app.js -->
    <div class="scene-tabs" id="scene-tabs" role="tablist" aria-label="Open scenes"></div>
  </div>

  <div class="panel viewport-panel">
      <div class="viewport" id="viewport">
        <div class="grid-bg"></div>
        <div class="shapes" id="shapes"></div>
        <div class="viewport-hint">Static mockup — live WASM canvas plugs in here later</div>
        <button class="viewport-settings" id="btn-settings" title="Settings">
          <svg viewBox="0 0 24 24"><use href="../editor/icons/settings.svg#icon" /></svg>
        </button>
        <div class="viewport-gizmos" role="toolbar" aria-label="Transform tools">
          <button class="gizmo active" data-tool="select" title="Select">
            <svg viewBox="0 0 24 24"><use href="icons/hand-pointer.svg#icon" /></svg>
          </button>
          <button class="gizmo" data-tool="move" title="Move">
            <svg viewBox="0 0 24 24"><use href="../editor/icons/transform-gizmo.svg#icon" /></svg>
          </button>
          <button class="gizmo" data-tool="rotate" title="Rotate">
            <svg viewBox="0 0 24 24"><use href="../editor/icons/rotate-orbit.svg#icon" /></svg>
          </button>
          <button class="gizmo" data-tool="scale" title="Scale">
            <svg viewBox="0 0 24 24"><use href="../editor/icons/scale-gizmo.svg#icon" /></svg>
          </button>
        </div>
      </div>
    </div>

    <div class="panel browser-panel">
      <div class="tabs" role="tablist">
        <button class="tab active" data-tab="assets">
          <svg viewBox="0 0 24 24"><use href="../editor/icons/folder.svg#icon" /></svg>Project
        </button>
        <button class="tab" data-tab="console">
          <svg viewBox="0 0 24 24"><rect x="3" y="4" width="18" height="16" rx="2" fill="none" stroke="currentColor" stroke-width="2"/><path d="M7 9l3 3-3 3M12 15h5" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg>Console
        </button>
      </div>
      <div class="tab-page" id="tab-assets">
        <nav class="crumb" id="crumb" aria-label="Folder path"></nav>
        <div class="folder-grid" id="folder-grid"></div>
      </div>
      <div class="tab-page hidden" id="tab-console">
        <div class="console" id="console-log">
          <div><span class="muted">[mock]</span> editor-v2 loaded — no backend connected.</div>
          <div><span class="muted">[mock]</span> select an entity to inspect its components.</div>
        </div>
      </div>
    </div>

  <!-- RIGHT: full-height inspector -->
  <aside class="panel right">
    <div class="panel-bar">
      <button class="ghost" id="toggle-right" title="Collapse panel">
        <svg viewBox="0 0 24 24"><use href="../editor/icons/dock-right.svg#icon" /></svg>
      </button>
    </div>
    <div class="entity-head">
      <svg viewBox="0 0 24 24" class="entity-icon"><use id="inspector-icon" href="../editor/icons/cube-outline.svg#icon" /></svg>
      <input id="inspector-name" type="text" value="" aria-label="Entity name" />
    </div>
    <div id="inspector"></div>
    <button class="add-component" id="add-component">
      <svg viewBox="0 0 24 24"><use href="../editor/icons/plus.svg#icon" /></svg>
      Add Component
    </button>
    <div class="preview-panel">
      <div class="preview-box" id="preview-box">
        <button class="viewport-settings" id="btn-preview-settings" title="Preview settings">
          <svg viewBox="0 0 24 24"><use href="../editor/icons/settings.svg#icon" /></svg>
        </button>
        <svg viewBox="0 0 24 24" class="preview-icon"><use id="preview-icon" href="../editor/icons/cube-outline.svg#icon" /></svg>
      </div>
    </div>
  </aside>
</main>

<script src="./app.js"></script>
</body>
</html>
