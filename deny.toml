# cargo-deny configuration for Ornis
# Docs: https://embarkstudios.github.io/cargo-deny/

[graph]
all-features = false
no-default-features = false

[output]
feature-depth = 1

[advisories]
version = 2
yanked = "warn"
ignore = []

[bans]
multiple-versions = "warn"
wildcards = "allow"
highlight = "all"
workspace-default-features = "allow"
external-default-features = "allow"
allow = []
deny = []
skip = []
skip-tree = []

[licenses]
version = 2
allow = [
    "MIT",
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "ISC",
    "Zlib",
    "Unicode-3.0",
    # MPL-2.0: стек lightningcss/cssparser (Servo) — file-level copyleft,
    # совместим с MIT/Apache-2.0 при линковке как отдельный крейт.
    "MPL-2.0",
    # CC0-1.0: option-ext (транзитивно через dirs).
    "CC0-1.0",
]
confidence-threshold = 0.8
exceptions = [
    # libfuzzer-sys: (MIT OR Apache-2.0) AND NCSA — NCSA по сути эквивалентна MIT.
    { allow = ["NCSA"], crate = "libfuzzer-sys" },
]
# Крейты workspace не опубликованы; license.workspace=true пока не проставлен —
# рекомендация из baseline-отчёта.
private = { ignore = true }

[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
allow-git = []
# Локальные path-зависимости (forks/boa_engine, crates/*) не являются
# git/registry-источниками, поэтому проверкой sources не затрагиваются.
