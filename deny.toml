# cargo-deny configuration for Ornis
# Docs: https://embarkstudios.github.io/cargo-deny/

[graph]
all-features = false
no-default-features = false

[output]
feature-depth = 1

[advisories]
version = 2
yanked = "deny"
# unmaintained is checked only for workspace crates: transitive
# ttf-parser ← ab_glyph ← sctk-adwaita ← winit; replacing (skrifa/fontations)
# requires a winit stack upgrade. (cargo-deny 0.20: all|workspace|transitive|none)
unmaintained = "workspace"
# Single source of truth for advisory ignores (cargo-audit has none —
# see .cargo/audit.toml). No active ignores: RUSTSEC-2026-0194/0195
# (quick-xml DoS, patched in >= 0.41.0) are closed — Cargo.lock already
# carries quick-xml 0.41.0 via wayland-scanner 0.31.11, so the stale
# entries were removed 2026-10-07 instead of being reformatted.
# Convention for any future ignore: { id = "RUSTSEC-...", reason = "..." }
# with a removal condition, e.g. "remove after upgrading winit >= 0.31".
ignore = []

[bans]
multiple-versions = "warn"
# Strict: no wildcard requirements. allow-wildcard-paths only exempts
# private crates, so workspace path deps carry explicit version = "0.1.0"
# (see Cargo.tomls) — required for this gate to pass.
wildcards = "deny"
allow-wildcard-paths = true
highlight = "all"
workspace-default-features = "allow"
external-default-features = "allow"
allow = []
deny = []
skip = []
skip-tree = []

[licenses]
version = 2
allow = [
    "MIT",
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "ISC",
    "Zlib",
    "Unicode-3.0",
    # MPL-2.0: the lightningcss/cssparser (Servo) stack — file-level copyleft,
    # compatible with MIT/Apache-2.0 when linked as a separate crate.
    "MPL-2.0",
    # CC0-1.0: option-ext (transitively via dirs).
    "CC0-1.0",
]
confidence-threshold = 0.8
exceptions = [
    # libfuzzer-sys: (MIT OR Apache-2.0) AND NCSA — NCSA is effectively equivalent to MIT.
    { allow = ["NCSA"], crate = "libfuzzer-sys" },
    # Existing manifold-rust -> clipper2-rust dependency from mesh-editor.
    # Boost Software License 1.0 is permissive; this exception is crate-scoped,
    # not a blanket license bypass. Keep upstream notices on redistribution.
    { allow = ["BSL-1.0"], crate = "clipper2-rust" },
]
# Workspace crates are not published; license.workspace=true not set yet —
# recommendation from the baseline report.
private = { ignore = true }

[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
allow-git = []
# Local path dependencies (forks/boa_engine, crates/*) are not
# git/registry sources, so the sources check does not touch them.
