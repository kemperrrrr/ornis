# cargo-deny configuration for Ornis
# Docs: https://embarkstudios.github.io/cargo-deny/

[graph]
all-features = false
no-default-features = false

[output]
feature-depth = 1

[advisories]
version = 2
yanked = "warn"
# unmaintained is checked only for workspace crates: transitive
# ttf-parser ← ab_glyph ← sctk-adwaita ← winit; replacing (skrifa/fontations)
# requires a winit stack upgrade. (cargo-deny 0.20: all|workspace|transitive|none)
unmaintained = "workspace"
ignore = [
    # quick-xml 0.39.4 comes transitively via wayland-scanner (build-time
    # proc-macro of the winit/smithay stack, Linux only). Updating to 0.41 is
    # blocked by the winit 0.30 → smithay-client-toolkit 0.19 → wayland-scanner
    # 0.31 pin. No attack surface: the parser runs on trusted Wayland protocol
    # XML at build time. Remove the ignore after a winit upgrade.
    "RUSTSEC-2026-0194",
    "RUSTSEC-2026-0195",
]

[bans]
multiple-versions = "warn"
wildcards = "allow"
highlight = "all"
workspace-default-features = "allow"
external-default-features = "allow"
allow = []
deny = []
skip = []
skip-tree = []

[licenses]
version = 2
allow = [
    "MIT",
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "ISC",
    "Zlib",
    "Unicode-3.0",
    # MPL-2.0: the lightningcss/cssparser (Servo) stack — file-level copyleft,
    # compatible with MIT/Apache-2.0 when linked as a separate crate.
    "MPL-2.0",
    # CC0-1.0: option-ext (transitively via dirs).
    "CC0-1.0",
]
confidence-threshold = 0.8
exceptions = [
    # libfuzzer-sys: (MIT OR Apache-2.0) AND NCSA — NCSA is effectively equivalent to MIT.
    { allow = ["NCSA"], crate = "libfuzzer-sys" },
]
# Workspace crates are not published; license.workspace=true not set yet —
# recommendation from the baseline report.
private = { ignore = true }

[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
allow-git = []
# Local path dependencies (forks/boa_engine, crates/*) are not
# git/registry sources, so the sources check does not touch them.
