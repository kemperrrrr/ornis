# cargo-deny configuration for Ornis
# Docs: https://embarkstudios.github.io/cargo-deny/

[graph]
all-features = false
no-default-features = false

[output]
feature-depth = 1

[advisories]
version = 2
yanked = "warn"
# unmaintained проверяется только для крейтов самого workspace: транзитивный
# ttf-parser ← ab_glyph ← sctk-adwaita ← winit; замена (skrifa/fontations)
# требует апгрейда стека winit. (cargo-deny 0.20: all|workspace|transitive|none)
unmaintained = "workspace"
ignore = [
    # quick-xml 0.39.4 приходит транзитивно через wayland-scanner (build-time
    # proc-macro стека winit/smithay, только Linux). Обновление до 0.41 заблокировано
    # пином winit 0.30 → smithay-client-toolkit 0.19 → wayland-scanner 0.31.
    # Поверхность атаки отсутствует: парсер применяется к доверенному XML
    # протоколов Wayland на этапе сборки. Снять ignore после апгрейда winit.
    "RUSTSEC-2026-0194",
    "RUSTSEC-2026-0195",
]

[bans]
multiple-versions = "warn"
wildcards = "allow"
highlight = "all"
workspace-default-features = "allow"
external-default-features = "allow"
allow = []
deny = []
skip = []
skip-tree = []

[licenses]
version = 2
allow = [
    "MIT",
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "ISC",
    "Zlib",
    "Unicode-3.0",
    # MPL-2.0: стек lightningcss/cssparser (Servo) — file-level copyleft,
    # совместим с MIT/Apache-2.0 при линковке как отдельный крейт.
    "MPL-2.0",
    # CC0-1.0: option-ext (транзитивно через dirs).
    "CC0-1.0",
]
confidence-threshold = 0.8
exceptions = [
    # libfuzzer-sys: (MIT OR Apache-2.0) AND NCSA — NCSA по сути эквивалентна MIT.
    { allow = ["NCSA"], crate = "libfuzzer-sys" },
]
# Крейты workspace не опубликованы; license.workspace=true пока не проставлен —
# рекомендация из baseline-отчёта.
private = { ignore = true }

[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
allow-git = []
# Локальные path-зависимости (forks/boa_engine, crates/*) не являются
# git/registry-источниками, поэтому проверкой sources не затрагиваются.
