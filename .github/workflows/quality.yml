name: Quality

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]
    # RAT-24: deliberately NO labeled/unlabeled types. Label events used
    # to spawn runs whose skipped jobs overwrote the real gate verdict on
    # the head (skipped counts as passed). The approval label is read
    # live from the PR API in the `fast` job instead — owner flow: set
    # the label, then "Re-run failed jobs".

env:
  CARGO_TERM_COLOR: always
  # B: CI runners have 4 vCPUs — use them. `.cargo/config.toml` keeps
  # `jobs = 2` as the local default (env overrides the file, so local
  # behavior is unchanged). Serialism for the shared lavapipe device is
  # kept at test *runtime* (`--test-threads=1` in xtask), not at build time.
  CARGO_BUILD_JOBS: 4
  # C: sccache env (CARGO_INCREMENTAL=0, RUSTC_WRAPPER, SCCACHE_GHA_ENABLED)
  # is scoped per compile job below — NOT global: the `fast` shard has no
  # sccache binary, and a global RUSTC_WRAPPER breaks its fallback
  # `cargo install rustqual` with "No such file or directory".

# Cancel superseded PR runs: a new push makes the previous 20-minute gate
# result irrelevant. Master pushes are never cancelled.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

# Explicit token scopes. Only the `report` job needs `pull-requests: write`
# (failure-digest comments); only the `fast` job needs `pull-requests:
# read` (it reads the live `baseline-bump-approved` label via the PR API
# — RAT-24); only `reset-approval` needs `pull-requests: write` (it
# removes that label on a new head, and checks out nothing). Every other
# job runs with the workflow-default `contents: read`. Shard jobs only
# read the repo and write their own log artifacts (actions: read is
# implicit for the runner, but listing it future-proofs against org-level
# Workflow permission changes).
permissions:
  contents: read

jobs:
  # Approval is per-head: the owner's `baseline-bump-approved` label must
  # not carry over to a later push (or a reopen after pushes to a closed
  # PR, which fire no `synchronize`) that grows the baseline further.
  # Threat model:
  # - Runs on the `pull_request` event: the token never gets secrets and,
  #   for fork PRs, is read-only. NOT `pull_request_target` — that would
  #   run with a write token in the context of untrusted PR content. This
  #   job additionally checks out nothing and runs no PR code: it only
  #   calls the REST API through `gh`, and its only inputs (PR number,
  #   repository) are passed via `env`, never interpolated into the script.
  # - Permissions are scoped to this job: `pull-requests: write` is the
  #   minimum that lets `DELETE .../labels/<name>` work; `contents` and
  #   everything else is `none` (a job-level `permissions` block replaces
  #   the workflow default). Fork PR + label present => the DELETE is
  #   forbidden => the job fails red and `fast` below fails with it
  #   (fail closed), instead of silently honouring a stale label.
  # - No race with the guard: `fast` runs only after this job, so it can
  #   never read the previous head's label. `run_attempt == 1` keeps the
  #   owner flow working: «set the label, then Re-run jobs» reruns with
  #   attempt >= 2 and must NOT strip the label just set.
  # - Out of scope: a PR that edits this job (or `fast`) to dodge the
  #   reset. The `pull_request` event runs the PR's own workflow files, so
  #   such a change is visible only in the diff under `.github/` — catching
  #   it is the owner's review (no CODEOWNERS: single-owner repo).
  reset-approval:
    if: github.event_name == 'pull_request' && github.run_attempt == 1
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      pull-requests: write
    steps:
      - name: Drop stale baseline-bump-approved label
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: |
          set -euo pipefail
          labels="$(gh pr view "$PR_NUMBER" --json labels --jq '.labels[].name')" || {
            echo "::error::gh pr view failed for PR #$PR_NUMBER — cannot check baseline-bump-approved"
            exit 1
          }
          if ! printf '%s\n' "$labels" | grep -qx 'baseline-bump-approved'; then
            echo "baseline-bump-approved not set — nothing to reset"
            exit 0
          fi
          gh api --method DELETE \
            "repos/$GH_REPO/issues/$PR_NUMBER/labels/baseline-bump-approved" >/dev/null || {
            echo "::error::could not remove baseline-bump-approved from PR #$PR_NUMBER (read-only token on a fork PR?)"
            exit 1
          }
          echo "::notice::baseline-bump-approved removed: PR head changed, approval does not carry over (owner: re-label, then re-run jobs)"

  # Sharding: `cargo xtask quality` is still the single source of truth for
  # gate composition — each shard runs the same xtask binary with
  # `--ci --only <ids>` (see `cargo xtask quality --list-stages`). Wall time
  # is the slowest shard, not the sum of all 13 stages.
  #
  # Shard map (stage ids):
  #   fast   — fmt, audit, deny, outdated, upgrade-check, rustqual, machete, typos (no compilation)
  #   clippy — clippy-physics, clippy
  #   test   — test, test-lockfree (workspace + ornis-core lock-free lanes)
  #   gpu    — test-physics, test-wasm2gpu, smoke (all need lavapipe; the
  #            default-suite determinism gates run inside test-physics,
  #            the ignored ones stay in Determinism Nightly).
  #            test-wasm2gpu also needs the wasm32 target. This job sets
  #            ORNIS_REQUIRE_GPU so a missing adapter fails the wasm2gpu
  #            GPU half; the xtask stage itself does not force that variable.
  #   docs   — doc, wasm-check
  fast:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    needs: [reset-approval]
    # `reset-approval` is skipped on push and on re-runs (attempt >= 2);
    # `!cancelled()` keeps `fast` running then. A FAILED reset must keep
    # the guard red (a skipped `fast` would count as passed), hence the
    # explicit first step instead of an `if` on the job.
    if: ${{ !cancelled() }}
    # RAT-24: this is the only gate job that talks to the PR API (live
    # `baseline-bump-approved` label, see below) — scope the grant here,
    # not workflow-wide. Explicit `contents: read` because a job-level
    # block replaces the workflow default (checkout needs it).
    permissions:
      contents: read
      pull-requests: read
    steps:
      - name: Require approval reset
        if: needs.reset-approval.result == 'failure'
        run: |
          echo "::error::reset-approval failed — a stale baseline-bump-approved label cannot be ruled out"
          exit 1

      # Full history: rustqual's failure diagnostics run `git archive
      # origin/<base>` for the reference measurement.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - uses: dtolnay/rust-toolchain@9ca9f0b320e19763058bc9531663c225d20db487 # 1.97
        with:
          components: rustfmt, clippy

      # `upgrade-check` no longer needs cargo-edit: it parses
      # `cargo outdated --workspace --format json` (cargo-outdated is
      # installed below), so it really runs here instead of SKIPping.
      # rustqual comes from the vendored Ornis fork (third_party/rustqual),
      # not crates.io — the fork carries workspace-aware layer resolution
      # the upstream 1.8.2 lacks.
      # Tool versions are pinned explicitly so CI stays reproducible
      # (install-action would otherwise float to latest on every run).
      # cargo-machete (unused deps) and typos (spell-check, `_typos.toml`)
      # are the RAT-9 gate tools.
      - uses: taiki-e/install-action@f7e5d7c961414b23f5b25b2da9294395d08513ad # v2
        with:
          tool: cargo-deny@0.20.2,cargo-audit@0.22.2,cargo-outdated@0.19.0,cargo-machete@0.9.2,typos@1.51.1

      # rust-cache BEFORE the fork build: otherwise the two rustqual
      # compile steps below run uncached on every fast-shard run.
      # The fork is excluded from the workspace (own target dir), so it
      # needs an explicit workspaces entry to be cached at all.
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
        with:
          shared-key: quality
          workspaces: |
            . -> target
            third_party/rustqual -> target

      - name: Build vendored rustqual
        run: |
          cargo build --release --manifest-path third_party/rustqual/Cargo.toml
          echo "$PWD/third_party/rustqual/target/release" >> "$GITHUB_PATH"

      - name: Verify rustqual version (vendored fork)
        run: ./third_party/rustqual/target/release/rustqual --version

      # RAT-24: read the owner-approval label live from the PR API instead
      # of the event payload, so labeling needs no workflow trigger (and
      # stray labels create no runs or skipped checks at all). Owner flow:
      # set `baseline-bump-approved`, then "Re-run failed jobs" — the
      # re-run sees the current labels. A new head resets the label first
      # (`reset-approval` job; it does not run on re-runs, so the label
      # set by the owner survives them). On push events there is no PR:
      # always false. The API call is hoisted out of any condition and a
      # failed lookup fails this job red via ::error:: — a silent
      # `false` (which would pass the gate as "not approved") must be
      # impossible. Needs `pull-requests: read` (job permissions above).
      - name: Resolve baseline-bump approval label
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: |
          allowed=false
          if [ -z "$PR_NUMBER" ]; then
            echo "no pull_request in event (push) — approval impossible"
          else
            labels="$(gh pr view "$PR_NUMBER" --json labels --jq '.labels[].name')" || {
              echo "::error::gh pr view failed for PR #$PR_NUMBER — cannot resolve baseline-bump-approved"
              exit 1
            }
            if printf '%s\n' "$labels" | grep -qx 'baseline-bump-approved'; then
              allowed=true
            fi
          fi
          echo "ORNIS_BASELINE_BUMP_ALLOWED=$allowed" >> "$GITHUB_ENV"
          echo "baseline-bump-approved: $allowed"

      - name: Quality gate (fast shard)
        id: gate
        shell: bash
        # RAT-24: the rustqual bump guard inside xtask compares the
        # committed baseline.json against origin/<base>. Growth FAILs
        # unless the owner set the `baseline-bump-approved` label, which
        # the previous step read live into ORNIS_BASELINE_BUMP_ALLOWED.
        run: |
          mkdir -p target
          cargo xtask quality --ci --only fmt,audit,deny,outdated,upgrade-check,rustqual,machete,typos 2>&1 | tee target/quality-fast.log

      - name: Upload shard log
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: quality-log-fast
          path: target/quality-fast.log
          retention-days: 7
          if-no-files-found: warn

  clippy:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      # C: sccache requires non-incremental compilation for cache hits.
      CARGO_INCREMENTAL: 0
      RUSTC_WRAPPER: sccache
      SCCACHE_GHA_ENABLED: "true"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 1

      - name: Install system dependencies
        timeout-minutes: 20
        run: |
          sudo sed -i 's|azure\.archive\.ubuntu\.com|archive.ubuntu.com|g' \
            /etc/apt/sources.list /etc/apt/sources.list.d/*.sources \
            /etc/apt/sources.list.d/*.list 2>/dev/null || true
          sudo apt-get update \
            -o Acquire::Retries=2 -o Acquire::http::Timeout=20 -o Acquire::https::Timeout=20 \
            -o Acquire::ForceIPv4=true
          sudo apt-get install -y --no-install-recommends -o Acquire::ForceIPv4=true \
            libasound2-dev libudev-dev pkg-config mesa-vulkan-drivers mold \
            libgtk-3-dev libwebkit2gtk-4.1-dev libayatana-appindicator3-dev librsvg2-dev

      - uses: dtolnay/rust-toolchain@9ca9f0b320e19763058bc9531663c225d20db487 # 1.97
        with:
          components: rustfmt, clippy

      - uses: mozilla-actions/sccache-action@fc920bf0ec8de6ee65d409111f7ec508035751ba # v0.0.11

      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
        with:
          shared-key: quality

      - name: Quality gate (clippy shard)
        id: gate
        shell: bash
        env:
          RUSTFLAGS: -C link-arg=-fuse-ld=mold
        run: |
          mkdir -p target
          cargo xtask quality --ci --only clippy-physics,clippy 2>&1 | tee target/quality-clippy.log

      - name: Upload shard log
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: quality-log-clippy
          path: target/quality-clippy.log
          retention-days: 7
          if-no-files-found: warn

  test:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      # C: sccache requires non-incremental compilation for cache hits.
      CARGO_INCREMENTAL: 0
      RUSTC_WRAPPER: sccache
      SCCACHE_GHA_ENABLED: "true"
      # GPU device tests must really execute here (mesa/lavapipe is
      # installed below): a missing adapter panics instead of skipping.
      ORNIS_REQUIRE_GPU: "1"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 1

      # Doctest binaries link whole dependency closures (wry/webkit,
      # gltf/image) outside mold's reach and SIGBUS otherwise: free the
      # ~15GB of preinstalled toolchains the build never touches.
      - name: Free disk space
        run: |
          sudo rm -rf /usr/share/dotnet /opt/ghc /usr/local/share/boost /usr/share/swift 2>/dev/null || true
          df -h / /tmp | head -5

      - name: Install system dependencies
        timeout-minutes: 20
        run: |
          sudo sed -i 's|azure\.archive\.ubuntu\.com|archive.ubuntu.com|g' \
            /etc/apt/sources.list /etc/apt/sources.list.d/*.sources \
            /etc/apt/sources.list.d/*.list 2>/dev/null || true
          sudo apt-get update \
            -o Acquire::Retries=2 -o Acquire::http::Timeout=20 -o Acquire::https::Timeout=20 \
            -o Acquire::ForceIPv4=true
          sudo apt-get install -y --no-install-recommends -o Acquire::ForceIPv4=true \
            libasound2-dev libudev-dev pkg-config mesa-vulkan-drivers mold \
            libgtk-3-dev libwebkit2gtk-4.1-dev libayatana-appindicator3-dev librsvg2-dev

      - uses: dtolnay/rust-toolchain@9ca9f0b320e19763058bc9531663c225d20db487 # 1.97
        with:
          components: rustfmt, clippy

      # The wasm2gpu end-to-end test compiles a shader with this target.
      # dtolnay/rust-toolchain may ignore rust-toolchain.toml targets.
      - name: Install wasm32 target
        run: rustup target add wasm32-unknown-unknown

      - uses: mozilla-actions/sccache-action@fc920bf0ec8de6ee65d409111f7ec508035751ba # v0.0.11

      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
        with:
          shared-key: quality

      - name: Quality gate (test shard)
        id: gate
        shell: bash
        env:
          RUSTFLAGS: -C link-arg=-fuse-ld=mold
          # Doctest links bypass RUSTFLAGS: route them through mold too,
          # or heavy closures (wry/webkit, gltf/image) SIGBUS the BFD link.
          RUSTDOCFLAGS: -C link-arg=-fuse-ld=mold
        run: |
          mkdir -p target
          cargo xtask quality --ci --only test,test-lockfree 2>&1 | tee target/quality-test.log

      - name: Upload shard log
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: quality-log-test
          path: target/quality-test.log
          retention-days: 7
          if-no-files-found: warn

  gpu:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      # C: sccache requires non-incremental compilation for cache hits.
      CARGO_INCREMENTAL: 0
      RUSTC_WRAPPER: sccache
      SCCACHE_GHA_ENABLED: "true"
      # test-wasm2gpu skips its GPU half unless this is set. Lavapipe is
      # installed below, so a missing adapter must fail the shard.
      ORNIS_REQUIRE_GPU: "1"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 1

      # mesa-vulkan-drivers — software Vulkan (lavapipe) for wgpu tests:
      # Ubuntu runners have no GPU; without an ICD no adapter is found
      # (no compatible GPU adapter found in ornis-wgpu-backend).
      # Free disk space first (same doctest-link rationale as test shard).
      - name: Free disk space
        run: |
          sudo rm -rf /usr/share/dotnet /opt/ghc /usr/local/share/boost /usr/share/swift 2>/dev/null || true
          df -h / /tmp | head -5

      - name: Install system dependencies
        timeout-minutes: 20
        run: |
          sudo sed -i 's|azure\.archive\.ubuntu\.com|archive.ubuntu.com|g' \
            /etc/apt/sources.list /etc/apt/sources.list.d/*.sources \
            /etc/apt/sources.list.d/*.list 2>/dev/null || true
          sudo apt-get update \
            -o Acquire::Retries=2 -o Acquire::http::Timeout=20 -o Acquire::https::Timeout=20 \
            -o Acquire::ForceIPv4=true
          sudo apt-get install -y --no-install-recommends -o Acquire::ForceIPv4=true \
            libasound2-dev libudev-dev pkg-config mesa-vulkan-drivers mold \
            libgtk-3-dev libwebkit2gtk-4.1-dev libayatana-appindicator3-dev librsvg2-dev

      - uses: dtolnay/rust-toolchain@9ca9f0b320e19763058bc9531663c225d20db487 # 1.97
        with:
          components: rustfmt, clippy

      # wasm2gpu's GPU test compiles the Rust shader to wasm32 in-process.
      - name: Install wasm32 target
        run: rustup target add wasm32-unknown-unknown

      - uses: mozilla-actions/sccache-action@fc920bf0ec8de6ee65d409111f7ec508035751ba # v0.0.11

      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
        with:
          shared-key: quality

      - name: Quality gate (gpu shard)
        id: gate
        shell: bash
        env:
          RUSTFLAGS: -C link-arg=-fuse-ld=mold
          # Same doctest-link rationale as the test shard.
          RUSTDOCFLAGS: -C link-arg=-fuse-ld=mold
        run: |
          mkdir -p target
          cargo xtask quality --ci --only test-physics,test-wasm2gpu,smoke 2>&1 | tee target/quality-gpu.log

      - name: Upload shard log
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: quality-log-gpu
          path: target/quality-gpu.log
          retention-days: 7
          if-no-files-found: warn

  docs:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      # C: sccache requires non-incremental compilation for cache hits.
      CARGO_INCREMENTAL: 0
      RUSTC_WRAPPER: sccache
      SCCACHE_GHA_ENABLED: "true"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 1

      - name: Install system dependencies
        timeout-minutes: 20
        run: |
          sudo sed -i 's|azure\.archive\.ubuntu\.com|archive.ubuntu.com|g' \
            /etc/apt/sources.list /etc/apt/sources.list.d/*.sources \
            /etc/apt/sources.list.d/*.list 2>/dev/null || true
          sudo apt-get update \
            -o Acquire::Retries=2 -o Acquire::http::Timeout=20 -o Acquire::https::Timeout=20 \
            -o Acquire::ForceIPv4=true
          sudo apt-get install -y --no-install-recommends -o Acquire::ForceIPv4=true \
            libasound2-dev libudev-dev pkg-config mold \
            libgtk-3-dev libwebkit2gtk-4.1-dev libayatana-appindicator3-dev librsvg2-dev

      - uses: dtolnay/rust-toolchain@9ca9f0b320e19763058bc9531663c225d20db487 # 1.97
        with:
          components: rustfmt, clippy

      # rust-toolchain.toml already declares the wasm target, but install it
      # explicitly so this job is correct even if the dtolnay action chooses
      # to ignore the file (it installs its own toolchain then).
      - name: Install wasm32 target
        run: rustup target add wasm32-unknown-unknown

      - uses: mozilla-actions/sccache-action@fc920bf0ec8de6ee65d409111f7ec508035751ba # v0.0.11

      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
        with:
          shared-key: quality

      - name: Quality gate (docs shard)
        id: gate
        # `cargo check`/`cargo doc` don't link, so no mold RUSTFLAGS here:
        # a host linker flag must never leak into the wasm target check.
        shell: bash
        run: |
          mkdir -p target
          cargo xtask quality --ci --only doc,wasm-check 2>&1 | tee target/quality-docs.log

      - name: Upload shard log
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: quality-log-docs
          path: target/quality-docs.log
          retention-days: 7
          if-no-files-found: warn

  # Merges the five shard logs and preserves the old single-job reporting:
  # one digest comment (QUALITY SUMMARY + tail) plus the full merged log as
  # chunked comments. Runs even when shards fail; stays silent on success.
  # NOTE: `failure()` inside this job sees only this job's own prior steps
  # (which almost never fail), NOT the `needs` shards — so the digest
  # predicate is computed from `needs.*.result` in each step's `if`.
  # (`cancelled()` is only allowed in `if`, not in job-level `env`, hence
  # no env indirection.) `cancelled` in a shard without a cancelled run
  # means a shard timeout — also worth a digest. A fully-cancelled run
  # (superseded by a new push via concurrency) is skipped by the job `if`.
  report:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    needs: [fast, clippy, test, gpu, docs]
    # Posts failure-digest PR comments — the only gate job that needs
    # `pull-requests: write`. Explicit `contents: read` because a
    # job-level block replaces the workflow default.
    permissions:
      contents: read
      pull-requests: write
    # `!cancelled()` so failure digests are posted even when a shard fails,
    # but cancelled (superseded) runs publish nothing; the steps below
    # no-op on full success (except the merged-log artifact).
    if: ${{ !cancelled() }}
    steps:
      - name: Download shard logs
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: quality-log-*
          path: target/shard-logs
          merge-multiple: true

      - name: Merge shard logs
        shell: bash
        run: |
          mkdir -p target
          {
            for f in target/shard-logs/quality-*.log; do
              [ -f "$f" ] || continue
              echo "════════ ${f##*/} ════════"
              cat "$f"
              echo
            done
          } > target/quality.log
          ls -la target/quality.log target/shard-logs/ || true

      - name: Upload merged log
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: quality-log
          path: target/quality.log
          retention-days: 7
          if-no-files-found: warn

      # One comment per PR, overwritten on each failing run. Built from the
      # QUALITY SUMMARY blocks of the shard outputs (per-stage PASS/FAIL/SKIP)
      # plus a collapsible tail of the merged log. The agent reads this via
      # the PR comments endpoint and iterates from it.
      - name: Build failure digest body
        if: (contains(needs.*.result, 'failure') || (contains(needs.*.result, 'cancelled') && !cancelled())) && github.event_name == 'pull_request'
        env:
          HEAD_REF: ${{ github.head_ref }}
          RUN_ID: ${{ github.run_id }}
          SERVER_URL: ${{ github.server_url }}
          REPOSITORY: ${{ github.repository }}
        run: |
          {
            printf '❌ **Quality gate failed** on `%s` (run [%s](%s/%s/actions/runs/%s)).\n\n' \
              "$HEAD_REF" "$RUN_ID" "$SERVER_URL" "$REPOSITORY" "$RUN_ID"
            echo '### 📊 QUALITY SUMMARY (per shard)'
            echo
            echo '```text'
            if [ -f target/quality.log ]; then
              if grep -q 'QUALITY SUMMARY' target/quality.log; then
                awk '/QUALITY SUMMARY/,/^╚/' target/quality.log
              else
                echo '(no summary block found in log — xtask may have crashed before printing it)'
              fi
            else
              echo '(target/quality.log missing — shard logs were not produced;'
              echo ' see the individual shard job outputs in the Actions run)'
            fi
            echo '```'
            echo
            echo '### 📜 Tail of merged log (200 lines)'
            echo
            echo '```text'
            if [ -f target/quality.log ]; then
              tail -n 200 target/quality.log
            else
              echo '(no log file — see above)'
            fi
            echo '```'
            echo
            echo 'Full logs are in the `quality-log` artifact (merged) and the per-shard `quality-log-<shard>` artifacts of this run.'
          } > target/comment-body.md

      - name: Post failure digest to PR
        if: (contains(needs.*.result, 'failure') || (contains(needs.*.result, 'cancelled') && !cancelled())) && github.event_name == 'pull_request'
        uses: peter-evans/create-or-update-comment@e8674b075228eee787fea43ef493e45ece1004c9 # v5.0.0
        with:
          issue-number: ${{ github.event.pull_request.number }}
          body-path: target/comment-body.md

      # Full merged gate log — split into a series of PR comments with ≤60k
      # chars each (GitHub limit is 65536 per comment). Each run OVERWRITES
      # prior chunk comments (PATCH) instead of creating new ones: same
      # permissions already granted (pull-requests: write).
      # Marker <!--quality-log--> at the body start — used for lookup on read.
      - name: Publish full log as chunked PR comments
        if: (contains(needs.*.result, 'failure') || (contains(needs.*.result, 'cancelled') && !cancelled())) && github.event_name == 'pull_request'
        env:
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          RUN_ID: ${{ github.run_id }}
        run: |
          python3 - <<'PY'
          import json, os, re, urllib.request

          API = f"https://api.github.com/repos/{os.environ['GITHUB_REPOSITORY']}"
          PR = os.environ['PR_NUMBER']
          RUN = os.environ['RUN_ID']
          TOKEN = os.environ['GH_TOKEN']
          MARK = '<!--quality-log-->'

          def call(method, url, body=None):
              data = json.dumps(body).encode() if body is not None else None
              req = urllib.request.Request(url, method=method, data=data, headers={
                  'Authorization': f'Bearer {TOKEN}',
                  'Accept': 'application/vnd.github+json',
              })
              with urllib.request.urlopen(req) as r:
                  txt = r.read()
              return json.loads(txt) if txt else None

          log_path = 'target/quality.log'
          if os.path.exists(log_path):
              log = open(log_path, encoding='utf-8', errors='replace').read()
          else:
              # Shards failed before tee could write their logs (e.g. missing
              # target/ on a cold rust-cache). Still post a marker comment
              # so the agent sees SOMETHING instead of a crashed step.
              log = ('(target/quality.log was not created — the shards failed\n'
                     'before tee wrote anything. Read the raw shard job outputs\n'
                     'in the Actions run referenced by the digest comment.)\n')
          log = re.sub(r'\x1b\[[0-9;]*m', '', log)  # ANSI codes from xtask
          chunks, buf = [], ''
          for line in log.splitlines(keepends=True):
              if buf and len(buf) + len(line) > 60000:
                  chunks.append(buf)
                  buf = line
              else:
                  buf += line
          if buf:
              chunks.append(buf)
          n = len(chunks)
          print(f'log: {len(log)} chars -> {n} chunks')

          comments = call('GET', f'{API}/issues/{PR}/comments?per_page=100')
          own = [c for c in comments if c['body'].startswith(MARK)]
          own.sort(key=lambda c: int(re.search(r'part (\d+)/', c['body']).group(1))
                   if re.search(r'part (\d+)/', c['body']) else 999)

          for i, chunk in enumerate(chunks, 1):
              body = (f'{MARK} Full quality.log (run {RUN}) — part {i}/{n}\n'
                      '```text\n' + chunk + '\n```\n')
              if i <= len(own):
                  call('PATCH', own[i - 1]['url'], {'body': body})
              else:
                  call('POST', f'{API}/issues/{PR}/comments', {'body': body})
          for c in own[n:]:  # log got shorter — clear leftover parts
              call('PATCH', c['url'], {'body': f'{MARK} (stale part — log got shorter)'})
          print('done')
          PY
