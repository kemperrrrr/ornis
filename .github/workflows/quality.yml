name: Quality

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

env:
  CARGO_TERM_COLOR: always

# Explicit token scopes. The failure-digest comment step needs
# `pull-requests: write`; the others (contents: read, actions: read)
# are implicit for the runner, but listing them is best practice and
# future-proofs the file against org-level Workflow permissions
# changes (Settings → Actions → General → Workflow permissions).
permissions:
  contents: read
  pull-requests: write

jobs:
  # Единственная джоба: ровно та же команда, что гоняется локально
  # (`cargo xtask quality --ci`). xtask — единственный источник правды о
  # составе гейта; этот файл занимается только установкой окружения
  # (системные пакеты, toolchain, wasm target, cargo-инструменты).
  quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          # Полная история + ветка master: bca (complexity gate) вычисляет
          # diff-scope через `git diff origin/master...HEAD`; при дефолтном
          # fetch-depth=1 base ref недоступен, и гейт молча деградирует к
          # проверке всего дерева (см. лог run 32586229447, стадия bca).
          fetch-depth: 0

      # Системные зависимости для Linux-сборки:
      # libasound2-dev — cpal (аудио), libudev-dev — gilrs/winit input,
      # pkg-config — общий build-time поиск библиотек.
      # mesa-vulkan-drivers — software Vulkan (lavapipe) для wgpu-тестов:
      # ubuntu runners не имеют GPU, без ICD адаптер не находится
      # (no compatible GPU adapter found в ornis-wgpu-backend).
      - name: Install system dependencies
        timeout-minutes: 10
        run: |
          # The Azure Ubuntu mirror (azure.archive.ubuntu.com) is periodically
          # unreachable from runners: apt retries every suite entry with long
          # timeouts before failing over to the public archive, which can hang
          # this step for hours. Point apt straight at the public archive and
          # fail fast instead.
          sudo sed -i 's|azure\.archive\.ubuntu\.com|archive.ubuntu.com|g' \
            /etc/apt/sources.list /etc/apt/sources.list.d/*.sources \
            /etc/apt/sources.list.d/*.list 2>/dev/null || true
          sudo apt-get update \
            -o Acquire::Retries=2 -o Acquire::http::Timeout=20 -o Acquire::https::Timeout=20 \
            -o Acquire::ForceIPv4=true
          sudo apt-get install -y -o Acquire::ForceIPv4=true \
            libasound2-dev libudev-dev pkg-config mesa-vulkan-drivers

      - uses: dtolnay/rust-toolchain@1.97
        with:
          components: rustfmt, clippy

      # rust-toolchain.toml already declares the wasm target, but install it
      # explicitly so this job is correct even if the dtolnay action chooses
      # to ignore the file (it installs its own toolchain then).
      - name: Install wasm32 target
        run: rustup target add wasm32-unknown-unknown

      # Supply-chain-tools: same set `cargo xtask quality` expects locally.
      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-deny,cargo-audit,cargo-outdated

      # bca (big-code-analysis-cli) is not in taiki-e/install-action's tool
      # manifest, so install it with the same command `cargo xtask bca
      # --install` uses. The tool is optional: if this step fails, the
      # quality gate SKIPs the complexity stage (same contract as
      # audit/deny/outdated) instead of failing.
      - name: Install bca (optional, complexity gate)
        continue-on-error: true
        run: cargo install big-code-analysis-cli --locked

      - uses: Swatinem/rust-cache@v2

      # The one command. Locally: same flags, same result.
      # `tee` mirrors stdout+stderr to the GitHub log AND to
      # `target/quality.log`, which the post-failure steps below
      # read to build a structured PR comment. The arena.ai agent
      # operates only via GitHub API and its sandbox's egress proxy
      # blocks the Azure Blob endpoint where GitHub stores the raw
      # run logs, so we re-publish a digest in the same API channel
      # the agent can read.
      - name: Quality gate
        id: gate
        # No `continue-on-error` here on purpose: the post-failure steps
        # below use `if: steps.gate.outcome == 'failure'`, so they still
        # run on failure, but the JOB must be red so the PR check and
        # the status badge reflect reality. An earlier version of this
        # file had `continue-on-error: true` on this step, which made
        # the job silently green whenever the gate failed — a footgun.
        #
        # `shell: bash` is set explicitly because the step pipes through
        # `tee`: without pipefail the pipeline's exit code is tee's (0),
        # and a failing gate shows green. The runner's default shell on
        # this repo resolved to plain `bash -e` (no pipefail), so the
        # default cannot be relied on — `shell: bash` on Linux maps to
        # `bash --noprofile --norc -eo pipefail {0}`.
        shell: bash
        run: cargo xtask quality --ci 2>&1 | tee target/quality.log

      # Artifact: full log, kept 7 days. Visible in the Actions UI
      # (not the agent's reach, but useful for humans debugging the
      # gate itself or comparing two runs).
      - name: Upload failure log
        if: failure() && steps.gate.outcome == 'failure'
        uses: actions/upload-artifact@v4
        with:
          name: quality-log
          path: target/quality.log
          retention-days: 7
          if-no-files-found: warn

      # One comment per PR, overwritten on each failing run. Built
      # from the QUALITY SUMMARY block of the xtask output (per-stage
      # PASS/FAIL/SKIP, a clean structured view) plus a collapsible
      # tail of the raw log. The agent reads this via the PR comments
      # endpoint and iterates from it.
      - name: Build failure digest body
        if: failure() && github.event_name == 'pull_request' && steps.gate.outcome == 'failure'
        env:
          HEAD_REF: ${{ github.head_ref }}
          RUN_ID: ${{ github.run_id }}
          SERVER_URL: ${{ github.server_url }}
          REPOSITORY: ${{ github.repository }}
        run: |
          {
            printf '❌ **Quality gate failed** on `%s` (run [%s](%s/%s/actions/runs/%s)).\n\n' \
              "$HEAD_REF" "$RUN_ID" "$SERVER_URL" "$REPOSITORY" "$RUN_ID"
            echo '### 📊 QUALITY SUMMARY'
            echo
            echo '```text'
            if grep -q 'QUALITY SUMMARY' target/quality.log; then
              awk '/QUALITY SUMMARY/,/^╚/' target/quality.log
            else
              echo '(no summary block found in log — xtask may have crashed before printing it)'
            fi
            echo '```'
            echo
            echo '### 📜 Tail of log (200 lines)'
            echo
            echo '```text'
            tail -n 200 target/quality.log
            echo '```'
            echo
            echo 'Полные логи — в артефакте `quality-log` этого run.'
          } > target/comment-body.md

      - name: Post failure digest to PR
        if: failure() && github.event_name == 'pull_request' && steps.gate.outcome == 'failure'
        uses: peter-evans/create-or-update-comment@v4
        with:
          issue-number: ${{ github.event.pull_request.number }}
          body-path: target/comment-body.md

      # Полный лог гейта — в серию PR-комментариев по ≤60k символов
      # (лимит GitHub — 65536 на комментарий). Каждый прогон
      # ПЕРЕЗАПИСЫВАЕТ прежние chunk-комментарии (PATCH), а не плодит
      # новые: права те же, что уже выданы (pull-requests: write).
      # Маркер <!--quality-log--> в начале тела — для поиска при чтении.
      - name: Publish full log as chunked PR comments
        if: failure() && github.event_name == 'pull_request' && steps.gate.outcome == 'failure'
        env:
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          RUN_ID: ${{ github.run_id }}
        run: |
          python3 - <<'PY'
          import json, os, re, urllib.request

          API = f"https://api.github.com/repos/{os.environ['GITHUB_REPOSITORY']}"
          PR = os.environ['PR_NUMBER']
          RUN = os.environ['RUN_ID']
          TOKEN = os.environ['GH_TOKEN']
          MARK = '<!--quality-log-->'

          def call(method, url, body=None):
              data = json.dumps(body).encode() if body is not None else None
              req = urllib.request.Request(url, method=method, data=data, headers={
                  'Authorization': f'Bearer {TOKEN}',
                  'Accept': 'application/vnd.github+json',
              })
              with urllib.request.urlopen(req) as r:
                  txt = r.read()
              return json.loads(txt) if txt else None

          log = open('target/quality.log', encoding='utf-8', errors='replace').read()
          log = re.sub(r'\x1b\[[0-9;]*m', '', log)  # ANSI-коды xtask
          chunks, buf = [], ''
          for line in log.splitlines(keepends=True):
              if buf and len(buf) + len(line) > 60000:
                  chunks.append(buf)
                  buf = line
              else:
                  buf += line
          if buf:
              chunks.append(buf)
          n = len(chunks)
          print(f'log: {len(log)} chars -> {n} chunks')

          comments = call('GET', f'{API}/issues/{PR}/comments?per_page=100')
          own = [c for c in comments if c['body'].startswith(MARK)]
          own.sort(key=lambda c: int(re.search(r'part (\d+)/', c['body']).group(1))
                   if re.search(r'part (\d+)/', c['body']) else 999)

          for i, chunk in enumerate(chunks, 1):
              body = (f'{MARK} Full quality.log (run {RUN}) — part {i}/{n}\n'
                      '```text\n' + chunk + '\n```\n')
              if i <= len(own):
                  call('PATCH', own[i - 1]['url'], {'body': body})
              else:
                  call('POST', f'{API}/issues/{PR}/comments', {'body': body})
          for c in own[n:]:  # лог стал короче — лишние части затираем
              call('PATCH', c['url'], {'body': f'{MARK} (часть устарела — лог стал короче)'})
          print('done')
          PY