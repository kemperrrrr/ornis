# Тяжёлые проверки, которые не должны блокировать PR:
# cargo-mutants (мутационное тестирование) и cargo miri (UB-детектор).
#
# Запускается при **одновременном** выполнении двух условий:
#   1) сработал cron (== наступило время 03:00 UTC);
#   2) на default branch есть новые коммиты с момента последнего
#      успешного run'а этого workflow.
# Если новых коммитов нет — check-job выдаёт should_run=false, и
# остальные job'ы уходят в Skipped. Проверка в check-job, чтобы
# было видно в Actions UI с явной диагностикой, что именно отвалилось.
#
# Также доступен ручной запуск через workflow_dispatch — оба условия
# для него не нужны, гоним всегда (для отладки и расширения).
#
# Зачем отдельно от quality.yml: cargo-mutants на workspace считает
# часы (каждый тест × каждый мутант), miri — десятки минут на cold
# start. На каждый PR это неподъёмно. Здесь — ночной и ручной.

name: Verify (heavy)

on:
  schedule:
    - cron: '0 3 * * *'
  workflow_dispatch:

concurrency:
  group: verify-heavy
  cancel-in-progress: false

permissions:
  contents: read
  actions: read

jobs:
  check:
    name: Skip if no new commits
    runs-on: ubuntu-latest
    permissions:
      actions: read
      contents: read
    outputs:
      should_run: ${{ steps.decide.outputs.should_run }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - id: decide
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          trigger="${{ github.event_name }}"

          # Ручной запуск — оба условия не нужны, гоним всегда.
          if [[ "$trigger" == "workflow_dispatch" ]]; then
            echo "✅ trigger=workflow_dispatch — оба условия не требуются" \
              | tee -a "$GITHUB_STEP_SUMMARY"
            echo "should_run=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          # Условие 1: сработал cron (== наступило время).
          # Условие 2: есть новые коммиты (head != last_success_sha).
          #
          # Оба одновременно → гоним. Только одно → skip с явной причиной.

          last_success_sha=$(gh api \
            -H "Accept: application/vnd.github+json" \
            "/repos/${{ github.repository }}/actions/workflows/verify-heavy.yml/runs?status=success&per_page=1" \
            | jq -r '.workflow_runs[0].head_sha // empty')
          current_sha="${{ github.sha }}"

          if [[ -n "$last_success_sha" && "$last_success_sha" == "$current_sha" ]]; then
            # Условие 1 ✅, условие 2 ❌ — skip.
            echo "⏭ trigger=$trigger (time=ok), НО условие 2 не выполнено: новых коммитов нет" \
              | tee -a "$GITHUB_STEP_SUMMARY"
            echo "  head=$current_sha совпадает с последним успешным run'ом ($last_success_sha)" \
              | tee -a "$GITHUB_STEP_SUMMARY"
            echo "should_run=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          # Оба условия ✅
          echo "✅ trigger=$trigger (time=ok) И условие 2 ok: есть новые коммиты" \
            | tee -a "$GITHUB_STEP_SUMMARY"
          echo "  head=$current_sha, last_success=$last_success_sha" \
            | tee -a "$GITHUB_STEP_SUMMARY"
          echo "should_run=true" >> "$GITHUB_OUTPUT"

  mutants:
    name: cargo mutants (ornis-physics)
    needs: check
    if: needs.check.outputs.should_run == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 360
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4

      - name: Install cargo-mutants
        run: cargo install cargo-mutants --locked

      # 60s на каждый test run — защита от зависших тестов.
      # mutants.out/ — артефакт с логами по каждому мутанту.
      # Точечный старт: ornis-physics, как заявлено в PLAN.md («mutants на солвер»).
      # Расширять по результату: ornis-core, ornis-render и т.д.
      - name: Run cargo mutants on ornis-physics
        run: cargo mutants --package ornis-physics --timeout 60

      - name: Upload mutants log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: mutants-log
          path: mutants.out
          retention-days: 7
          if-no-files-found: warn

  miri:
    name: Miri (ornis-core)
    needs: check
    if: needs.check.outputs.should_run == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 180
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4

      # Miri — это nightly component. Сам проект остаётся на stable 1.97,
      # только этот job переключается на nightly для miri.
      - name: Install Miri (nightly component)
        run: rustup toolchain install nightly --component miri --profile minimal

      # Первый запуск в job'е пересобирает stdlib под miri (~5–10 мин, кэшируется
      # на runner'е до следующего cold start).
      - name: Miri setup
        run: cargo +nightly miri setup

      # Точечный прогон: ornis-core — sync, без WASM, без async; содержит
      # самые «интересные» unsafe-блоки (lock_free_store, prefetch, smart_store).
      # cargo miri не работает на wasm32 и не понимает async — поэтому
      # именно core, а не workspace.
      #
      # MIRIFLAGS=-Zmiri-permissive-provenance: crossbeam-epoch (через rayon)
      # использует устаревшие usize→*const T касты; в strict-режиме Miri
      # выдаёт на них false positive Stacked Borrows violations.
      # permissive-provenance убирает false positive от crossbeam-epoch,
      # оставляя Stacked Borrows включёнными для нашего unsafe-кода.
      # --skip rayon: Miri плохо подходит для тестирования rayon-параллелизма,
      # эти тесты про сам rayon, не про наш код.
      - name: Miri test on ornis-core
        env:
          MIRIFLAGS: "-Zmiri-permissive-provenance"
        run: cargo +nightly miri test -p ornis-core --lib -- --skip rayon

      - name: Upload Miri log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: miri-log
          path: target/miri
          retention-days: 7
          if-no-files-found: warn
