name: Determinism Nightly

# Long determinism gates (#[ignore]d in the default suite, ~95% of the
# physics suite runtime) run here — NOT in the per-push Quality gate,
# which would burn CI limits on every commit. README promises
# determinism (Strong Confluence) as an engine property; this job
# holds that promise overnight.
#
# Regenerate helpers (*_regenerate, also #[ignore]d) are EXCLUDED via
# --skip: they rewrite canonical snapshots and must stay manual.
# Known-limit scenarios (known_limit_*, also #[ignore]d) are EXCLUDED
# too: they pin solver limits and are expected to fail. --no-fail-fast
# keeps one failing test binary from hiding the remaining gates.
#
# Fast PR subset (RAT-11): the small-N default-suite determinism gates
# run in every PR via the `determinism-fast` xtask stage (Quality `gpu`
# shard, ~+30 s, no rebuild). The ignored gates stay here: measured
# 2026-10-08, `avbd_confluence_one_vs_many_threads` alone takes ~7 min
# in a debug build (CI `cargo test` is debug), so no ignored gate fits
# a PR shard.

on:
  schedule:
    - cron: '0 2 * * *' # 02:00 UTC daily
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always

permissions:
  contents: read

jobs:
  determinism:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0

      - uses: dtolnay/rust-toolchain@9ca9f0b320e19763058bc9531663c225d20db487 # 1.97
        with:
          components: rustfmt, clippy

      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2

      - name: Ignored determinism gates (except regenerate helpers)
        shell: bash
        run: |
          set -o pipefail
          mkdir -p target
          cargo test -p ornis-physics --no-fail-fast -- --ignored --skip regenerate --skip known_limit_ 2>&1 | tee target/determinism-nightly.log

      - name: Canonical snapshots untouched
        shell: bash
        run: |
          mkdir -p target
          git status --porcelain -- crates/physics/tests/data/ | tee target/determinism-dirty.log
          test ! -s target/determinism-dirty.log

  # Feature matrix (RAT-9): every feature of every workspace crate must
  # `cargo check` without dev-deps (`cargo hack check --workspace
  # --each-feature --no-dev-deps`, via `cargo xtask quality --full
  # --only hack-check`). Nightly — one `cargo check` per feature is too
  # slow for the per-push gate. Pinned tool version (cargo-hack@0.6.45),
  # same single-source-of-truth xtask stage CI shards use.
  feature-matrix:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Install system dependencies
        timeout-minutes: 20
        run: |
          sudo sed -i 's|azure\.archive\.ubuntu\.com|archive.ubuntu.com|g' \
            /etc/apt/sources.list /etc/apt/sources.list.d/*.sources \
            /etc/apt/sources.list.d/*.list 2>/dev/null || true
          sudo apt-get update \
            -o Acquire::Retries=2 -o Acquire::http::Timeout=20 -o Acquire::https::Timeout=20 \
            -o Acquire::ForceIPv4=true
          sudo apt-get install -y --no-install-recommends -o Acquire::ForceIPv4=true \
            libasound2-dev libudev-dev pkg-config \
            libgtk-3-dev libwebkit2gtk-4.1-dev libayatana-appindicator3-dev librsvg2-dev

      - uses: dtolnay/rust-toolchain@1.97
        with:
          components: rustfmt, clippy

      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-hack@0.6.45

      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: quality-nightly

      - name: Feature matrix (cargo hack via xtask)
        shell: bash
        run: |
          mkdir -p target
          cargo xtask quality --full --only hack-check 2>&1 | tee target/feature-matrix.log

      - name: Upload feature-matrix log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: feature-matrix-log
          path: target/feature-matrix.log
          retention-days: 7
          if-no-files-found: warn
