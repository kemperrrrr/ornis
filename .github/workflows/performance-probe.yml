name: Performance probe (100k bodies)

on:
  # Manual trigger for 100k probe (can take 30+ minutes)
  workflow_dispatch:
    inputs:
      backend:
        description: 'Broadphase backend'
        type: choice
        options:
          - sweep
          - grid
        default: grid
      cell_size:
        description: 'Grid cell size (for grid backend only)'
        type: string
        default: '8'
      steps:
        description: 'Number of simulation steps'
        type: number
        default: 3
      target_ref:
        description: 'PR head SHA to benchmark (empty → use dispatcher ref)'
        type: string
        default: ''

env:
  CARGO_TERM_COLOR: always
  # Smoke-level ceiling (RAT-11), not a precision gate: 100k tiled Grid 8.0
  # steady is ~8 s/step on M1 (docs/quality/perf-baseline-2026-09-02.md),
  # so 30 s median leaves ~3× headroom for CI noise while still catching
  # backend blowups (SAP-scale ~80 s) and hangs. No automatic re-run — a
  # 100k re-probe costs tens of minutes; re-dispatch manually instead.

  PERF_PROBE_MAX_MEDIAN_STEP_S: 30

permissions:
  contents: read

jobs:
  probe-100k:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
          ref: ${{ inputs.target_ref || github.ref }}

      # System dependencies (same as performance.yml)
      - name: Install system dependencies
        timeout-minutes: 10
        run: |
          sudo sed -i 's|azure\.archive\.ubuntu\.com|archive.ubuntu.com|g' \
            /etc/apt/sources.list /etc/apt/sources.list.d/*.sources \
            /etc/apt/sources.list.d/*.list 2>/dev/null || true
          sudo apt-get update \
            -o Acquire::Retries=2 -o Acquire::http::Timeout=20 -o Acquire::https::Timeout=20 \
            -o Acquire::ForceIPv4=true
          sudo apt-get install -y -o Acquire::ForceIPv4=true \
            libasound2-dev libudev-dev pkg-config mesa-vulkan-drivers

      - uses: dtolnay/rust-toolchain@9ca9f0b320e19763058bc9531663c225d20db487 # 1.97
        with:
          components: rustfmt, clippy

      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2

      # Run 100k body probe with step-by-step timing
      - name: Run 100k probe
        id: probe
        shell: bash
        run: |
          set -o pipefail
          mkdir -p target
          
          # Build command with parameters
          BACKEND_FLAG=""
          if [ "${{ inputs.backend }}" = "grid" ]; then
            BACKEND_FLAG="--grid --cell-size ${{ inputs.cell_size }}"
          fi
          
          cargo run -p ornis-physics --release --example probe_100k -- \
            ${BACKEND_FLAG} --bodies 100000 --steps ${{ inputs.steps }} \
            2>&1 | tee target/probe_100k.log

      # Threshold gate (RAT-11): median of measured steps (step 0 is
      # broadphase warm-up and is excluded) must stay under
      # PERF_PROBE_MAX_MEDIAN_STEP_S. Fails loudly on breach; no re-run
      # (see env comment above).
      - name: Check probe threshold
        id: probe-gate
        shell: bash
        run: |
          python3 - <<'PY'
          import os, re, statistics, sys

          limit = float(os.environ.get("PERF_PROBE_MAX_MEDIAN_STEP_S", "30"))
          units = {"ns": 1e-9, "us": 1e-6, "µs": 1e-6, "μs": 1e-6,
                   "ms": 1e-3, "s": 1.0, "m": 60.0}
          steps = {}
          with open("target/probe_100k.log", encoding="utf-8", errors="replace") as f:
              for line in f:
                  m = re.match(r"^step (\d+): ([\d.]+)\s*(ns|µs|μs|us|ms|s|m)\s*$",
                               line.strip())
                  if m:
                      steps[int(m.group(1))] = float(m.group(2)) * units[m.group(3)]
          measured = [t for i, t in sorted(steps.items()) if i > 0]
          lines = ["## 📊 Probe threshold gate", ""]
          if not measured:
              lines.append("No measured `step N:` lines found — gate skipped (INFO).")
              print("\n".join(lines))
              with open(os.environ["GITHUB_STEP_SUMMARY"], "a") as f:
                  f.write("\n".join(lines) + "\n")
              sys.exit(0)
          median = statistics.median(measured)
          status = "✅" if median <= limit else "❌"
          lines.append(f"{status} median step {median:.2f} s over {len(measured)} "
                       f"measured steps (limit {limit:g} s).")
          print("\n".join(lines))
          with open(os.environ["GITHUB_STEP_SUMMARY"], "a") as f:
              f.write("\n".join(lines) + "\n")
          if median > limit:
              print(f"::error title=probe-threshold::median step {median:.2f}s "
                    f"exceeds {limit:g}s")
              sys.exit(1)
          PY

      # Extract results and publish to job summary
      - name: Publish probe results
        if: always()
        env:
          BACKEND: ${{ inputs.backend }}
          CELL_SIZE: ${{ inputs.cell_size }}
          STEPS: ${{ inputs.steps }}
        run: |
          {
            echo "## 📊 100k Bodies Probe Results"
            echo
            echo "**Config:**"
            echo "- Backend: \`${BACKEND}\`"
            if [ "${BACKEND}" = "grid" ]; then
              echo "- Cell size: \`${CELL_SIZE}\`"
            fi
            echo "- Steps: \`${STEPS}\`"
            echo "- Bodies: 100,000"
            echo
            echo "**Duration:** Varies with backend and system load"
            echo
            if [ -f target/probe_100k.log ]; then
              echo "### Results"
              echo '<details><summary>Click to expand</summary>'
              echo
              echo '```text'
              cat target/probe_100k.log
              echo '```'
              echo '</details>'
            else
              echo "⚠️  Probe log not found"
            fi
            echo
            echo "**Note:** Probes 100k dynamic bodies on tiled floor, measures Sweep-and-Prune/"
            echo "UniformGrid behavior at scale. Times vary significantly with system load and hardware."
          } >> $GITHUB_STEP_SUMMARY

      # Upload probe log for reference
      - name: Upload probe log
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: probe-100k-log
          path: target/probe_100k.log
          retention-days: 30
          if-no-files-found: warn
